<!DOCTYPE html>
<html lang="ko" data-theme="night">
<head>
    <!-- 한글이 깨지지 않도록 문자 인코딩 지정 -->
    <meta charset="UTF-8">
    <!-- 휴대폰·태블릿에서도 화면 크기에 맞게 보이도록 설정
         viewport-fit=cover: 아이폰 노치(카메라 홈) 부분까지 화면을 씀 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- 휴대폰 브라우저 위쪽 주소창 색 (테마에 따라 자바스크립트가 바꿈) -->
    <meta name="theme-color" content="#0b1020" id="themeColorMeta">
    <title>타이머</title>
    <style>
        /* =================================================================
           1. 색상 테마
              html 태그의 data-theme 값에 따라 아래 색 묶음 중 하나가 적용됨
              --ok     : 평상시 숫자·막대 색        --on-ok   : 그 위에 올라가는 글자색
              --warn   : 시간이 얼마 안 남았을 때    --danger  : 거의 끝났을 때
              --end-bg : 종료 후 배경               --on-end  : 종료 후 숫자색
           ================================================================= */

        /* 밤하늘(기본): 짙은 남색 배경 + 하늘색 숫자. 눈이 편하고 프로젝터에서도 선명 */
        :root, [data-theme="night"] {
            --bg: #0b1020;  --fg: #e8ecf6;  --muted: #8b93ab;
            --panel: #151b2e;  --line: #283152;
            --ok: #8ec5ff;  --on-ok: #06203d;
            --warn: #ffd479;  --on-warn: #3a2a00;
            --danger: #ff7a85;
            --end-bg: #b3123b;  --on-end: #ffffff;
        }
        /* 민트: 처음 쓰시던 검정 배경 + 연두색 숫자 */
        [data-theme="mint"] {
            --bg: #000000;  --fg: #f2f2f2;  --muted: #8a8f98;
            --panel: #15181d;  --line: #2a2f37;
            --ok: rgb(174, 242, 166);  --on-ok: #06240a;
            --warn: #ffd166;  --on-warn: #3a2a00;
            --danger: #ff6b6b;
            --end-bg: #c1121f;  --on-end: #ffffff;
        }
        /* 노을: 따뜻한 갈색 배경 + 살구색 숫자 */
        [data-theme="sunset"] {
            --bg: #1b1214;  --fg: #f6ece6;  --muted: #a08f8a;
            --panel: #261a1c;  --line: #3d2c2e;
            --ok: #ffb38a;  --on-ok: #3a1606;
            --warn: #ffe08a;  --on-warn: #3a2a00;
            --danger: #ff5d73;
            --end-bg: #9e1030;  --on-end: #ffffff;
        }
        /* 밝게: 밝은 교실·낮 시간용. 미색 배경 + 짙은 초록 숫자 */
        [data-theme="light"] {
            --bg: #f5f3ee;  --fg: #1d2330;  --muted: #6b7280;
            --panel: #ffffff;  --line: #d9d4c7;
            --ok: #17795a;  --on-ok: #ffffff;
            --warn: #b86e00;  --on-warn: #ffffff;
            --danger: #c8102e;
            --end-bg: #c8102e;  --on-end: #ffffff;
        }
        /* 고대비: 멀리서도 가장 잘 보이는 검정 + 흰색 */
        [data-theme="contrast"] {
            --bg: #000000;  --fg: #ffffff;  --muted: #bbbbbb;
            --panel: #111111;  --line: #555555;
            --ok: #ffffff;  --on-ok: #000000;
            --warn: #ffe600;  --on-warn: #000000;
            --danger: #ff3b30;
            --end-bg: #d70015;  --on-end: #ffffff;
        }

        /* =================================================================
           2. 화면 크기에 따라 "기준 글자 크기"가 자동으로 바뀜
              아래의 크기는 대부분 rem(= 이 기준 크기의 배수)으로 적었기 때문에
              휴대폰에선 작게, 4K TV에선 크게 전체가 함께 커지고 작아짐 (16~44px)
           ================================================================= */
        html { font-size: clamp(16px, min(1.05vw, 1.9vh), 44px); }

        /* 모든 요소의 크기 계산에 테두리·여백을 포함 */
        * { box-sizing: border-box; }
        /* hidden 속성이 붙은 요소는 무조건 숨김 */
        [hidden] { display: none !important; }

        /* =================================================================
           3. 전체 레이아웃: 위(시계) - 가운데(타이머) 세로 배치
           ================================================================= */
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;                    /* 휴대폰 주소창 높이를 뺀 실제 화면 높이 */
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif;
            user-select: none;                     /* 연타 시 글자 선택 방지 */
            -webkit-tap-highlight-color: transparent; /* 휴대폰에서 누를 때 생기는 파란 상자 제거 */
            transition: background-color 0.4s, color 0.4s;
            /* 아이폰 노치·둥근 모서리에 내용이 가려지지 않게 안쪽 여백 확보 */
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        input { user-select: text; }               /* 입력칸은 선택 가능하게 */
        /* 버튼을 빠르게 두 번 눌러도 화면이 확대되지 않게 */
        button, input, label { touch-action: manipulation; }
        button { font-family: inherit; }

        /* ----- 상단 바: 날짜/현재 시각(왼쪽), 옵션(오른쪽) ----- */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1.2rem;
            color: var(--muted);
            font-size: 1rem;
            white-space: nowrap;                   /* 줄바꿈 없이 한 줄 유지 */
            position: relative;
            z-index: 5;                            /* 색상 메뉴가 다른 요소 위에 뜨도록 */
        }
        .clock { display: flex; gap: 0.8rem; font-variant-numeric: tabular-nums; }
        #currentTime { color: var(--fg); }
        .tools { display: flex; gap: 0.6rem; align-items: center; }
        .toggle { cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }

        /* 체크박스를 직접 그려서 화면 크기·테마에 맞춰 함께 바뀌게 함 */
        .toggle input {
            appearance: none;
            -webkit-appearance: none;
            font-size: inherit;               /* 입력 요소는 기본적으로 글자 크기를 물려받지 않으므로 지정 */
            width: 1em;
            height: 1em;
            margin: 0;
            border: 2px solid var(--muted);
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
        }
        .toggle input:checked { background: var(--ok); border-color: var(--ok); }
        .toggle input:checked::after {        /* 체크 표시(✓) */
            content: '';
            width: 0.28em;
            height: 0.5em;
            border: solid var(--on-ok);
            border-width: 0 0.12em 0.12em 0;
            transform: translateY(-0.06em) rotate(45deg);
        }

        /* ----- 색상 테마 선택 메뉴 ----- */
        .menu-wrap { position: relative; }
        #themeMenu {
            position: absolute;
            right: 0;
            top: calc(100% + 0.4rem);
            display: grid;
            grid-template-columns: repeat(5, auto);
            gap: 0.5rem;
            padding: 0.7rem;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 0.8rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
        .swatch {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            padding: 0;
            background: none;
            border: 0;
            color: var(--fg);
            font-size: 0.8rem;
            cursor: pointer;
        }
        /* 각 테마의 배경색·숫자색을 미리 보여 주는 작은 상자 */
        .swatch .sample {
            width: 3rem;
            height: 2.2rem;
            display: grid;
            place-content: center;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            background: var(--s-bg);
            color: var(--s-fg);
            border: 2px solid var(--line);
        }
        .swatch.active .sample { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }

        /* ----- 가운데 영역 ----- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;           /* 위에서부터 쌓음 (모드 스위치를 위에 고정하기 위해) */
            gap: clamp(10px, 2.2vh, 1.3rem);
            padding: 0 1rem 1.2rem;
            min-width: 0;
        }
        /* 모드 스위치는 항상 같은 자리(맨 위)에 고정.
           숫자~버튼 묶음만 남은 공간의 가운데에 오도록 위·아래 여백을 자동으로 나눔
           → 타이머↔스톱워치 전환 때 스위치가 움직이지 않아 연속으로 눌러도 잘 눌림 */
        main > .mode-switch { flex: none; margin-top: clamp(4px, 1vh, 0.6rem); }
        main > .display     { margin-top: auto; }
        main > .controls    { margin-bottom: auto; }
        /* 구간 기록 목록이 보일 땐 목록이 묶음의 맨 아래가 되도록 여백을 옮김 */
        body.has-laps main > .controls { margin-bottom: 0; }
        body.has-laps main > #laps     { margin-bottom: auto; }

        /* =================================================================
           4. 모드 전환 스위치 (타이머 / 스톱워치)
           ================================================================= */
        .mode-switch {
            display: inline-flex;
            padding: 0.2rem;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
        }
        .mode-switch button {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 0.95rem;
            padding: 0.45em 1.3em;
            border-radius: 999px;
            cursor: pointer;
        }
        .mode-switch button.active { background: var(--fg); color: var(--bg); font-weight: 700; }
        /* 다른 모드가 뒤에서 돌아가는 중이면 그 버튼 오른쪽 위에 작은 점 표시
           (글자를 바꾸면 버튼 폭이 달라져 스위치가 흔들리므로 점으로만 알림) */
        .mode-switch button { position: relative; }
        .mode-switch .badge {
            position: absolute;
            top: 0.3em;
            right: 0.5em;
            width: 0.45em;
            height: 0.45em;
            border-radius: 50%;
            display: none;
        }
        .mode-switch button.bg-running  .badge { display: block; background: var(--ok); animation: breathe 1.6s ease-in-out infinite; }
        .mode-switch button.bg-paused   .badge { display: block; background: var(--muted); }
        .mode-switch button.bg-finished .badge { display: block; background: var(--danger); animation: blink 1s steps(1) infinite; }

        /* =================================================================
           5. 큰 타이머 숫자 + 진행 막대 + 초과 시간
              --level 값에 따라 숫자와 막대 색이 함께 바뀜
           ================================================================= */
        .display {
            --level: var(--ok);
            width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .display.warn   { --level: var(--warn); }
        .display.danger { --level: var(--danger); }

        #timer {
            /* 실제 크기는 자바스크립트(fitTimer)가 화면에 꽉 차게 계산해서 넣음.
               이 값은 자바스크립트가 실행되기 전 잠깐 쓰이는 기본값 */
            font-size: min(17vw, 30vh);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--level);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transition: color 0.3s;
        }
        /* 큰 숫자 사이의 단위 글자(시간·분·초): 숫자보다 작게, 살짝 띄워서 */
        #timer .u {
            font-size: 0.36em;
            font-weight: 600;
            letter-spacing: 0;
            margin: 0 0.7em 0 0.1em;              /* 단위 글자 뒤에 다음 숫자와의 간격 */
            opacity: 0.8;
        }
        #timer .u:last-child { margin-right: 0; }   /* 맨 끝 "초" 뒤엔 여백 없음 */

        /* 진행 막대: 남은 시간 비율만큼 채워짐
           오른쪽 끝을 기준으로 두어서, 시간이 지나면 왼쪽부터 비워지며 오른쪽으로 줄어듦 */
        .progress {
            width: min(92%, 70rem);
            height: clamp(6px, 0.5rem, 18px);
            margin-top: clamp(8px, 2vh, 1.2rem);
            background: var(--line);
            border-radius: 999px;
            overflow: hidden;
        }
        #progressBar {
            height: 100%;
            background: var(--level);
            border-radius: 999px;
            transform-origin: right;               /* 오른쪽 기준 → 왼쪽에서 오른쪽으로 줄어듦 */
            transition: transform 0.1s linear, background-color 0.3s;
        }

        /* 종료 후 "시간 초과 +00:12" 표시 (평소엔 빈 칸으로 자리만 차지) */
        #overtime {
            min-height: 1.3em;
            margin-top: 0.5rem;
            font-size: 1.6rem;
            font-variant-numeric: tabular-nums;
        }

        /* =================================================================
           6. 시간 입력칸 (▲ 숫자 ▼) 과 프리셋
           ================================================================= */
        #setup {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            max-width: 100%;
        }
        /* 시/분/초 세 칸은 좁은 화면에서도 한 줄 유지 */
        .inputs { display: flex; gap: 0.8rem; align-items: flex-start; justify-content: center; }
        /* 한 칸 = ▲ 버튼 / 숫자 입력칸 / ▼ 버튼 / 단위 글자 (세로로 쌓음) */
        .field {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.25rem;
        }
        .step {
            padding: 0.15em 0;
            font-size: 0.85rem;
            line-height: 1;
            color: var(--muted);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 0.5em;
            cursor: pointer;
        }
        .step:active { color: var(--bg); background: var(--ok); border-color: var(--ok); }
        .field input {
            width: 2.5em;
            padding: 0.1em 0.1em;
            /* 폭이 좁은 휴대폰에선 화면 폭에 맞춰 작아짐 */
            font-size: min(2.2rem, 8.5vw);
            font-family: inherit;
            text-align: center;
            color: var(--fg);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 0.6rem;
            font-variant-numeric: tabular-nums;
        }
        .field input:focus { outline: 2px solid var(--ok); outline-offset: 2px; }
        .unit { text-align: center; font-size: 0.95rem; color: var(--muted); }
        /* 숫자 입력칸 옆의 브라우저 기본 위/아래 화살표 숨기기 (▲▼ 버튼을 따로 만들었으므로) */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* ----- 프리셋 버튼들 ----- */
        .preset-area { display: flex; flex-direction: column; align-items: center; gap: 0.45rem; }
        #presets, #examPresets, .preset-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.45rem; }
        /* 탭 하나에 해당하는 프리셋 묶음 */
        .preset-panel { display: flex; flex-direction: column; align-items: center; gap: 0.45rem; }

        /* [자주 쓰는 시간] [모의고사] 탭 */
        .preset-tabs {
            display: inline-flex;
            padding: 0.15rem;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
        }
        .tab {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 0.85rem;
            padding: 0.3em 1em;
            border-radius: 999px;
            cursor: pointer;
        }
        .tab.active { background: var(--line); color: var(--fg); font-weight: 700; }
        .chip {
            min-height: 2.2em;                     /* 손가락으로 누르기 쉬운 크기 */
            font-size: 0.95rem;
            padding: 0.3em 0.9em;
            color: var(--fg);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
        }
        /* 지금 입력된 시간과 같은 프리셋은 색을 채워 표시 */
        .chip.active { background: var(--ok); color: var(--on-ok); border-color: transparent; font-weight: 700; }
        /* 편집 중인 프리셋: 빨간 테두리 + ✕ 표시 */
        .chip.editing { border-color: var(--danger); }
        .chip .x { margin-left: 0.3em; color: var(--danger); font-weight: 700; }
        /* "프리셋 저장 / 편집" 같은 관리용 버튼은 점선으로 구분 */
        .chip.ghost { color: var(--muted); border-style: dashed; font-size: 0.85rem; }
        /* OMR 5분 제외 버튼: 켜지면 노란색으로 채워짐 */
        .chip.omr { border-style: dashed; }
        .chip.omr[aria-pressed="true"] {
            background: var(--warn);
            color: var(--on-warn);
            border-color: transparent;
            border-style: solid;
            font-weight: 700;
        }

        /* 큰 숫자 위의 설명 글자 (예: "국어 80분 · OMR 작성 5분 제외") */
        #caption {
            margin-bottom: 0.4rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: inherit;
            opacity: 0.85;
            text-align: center;
        }
        #caption:empty { display: none; }   /* 설명이 없으면 자리도 차지하지 않음 */

        /* =================================================================
           7. 조작 버튼
           ================================================================= */
        .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
        .btn {
            min-width: 5em;
            padding: 0.45em 1em;
            font-size: 1.4rem;
            color: var(--fg);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 0.6em;
            cursor: pointer;
            transition: filter 0.2s, background-color 0.2s;
        }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn.small { min-width: 0; padding: 0.3em 0.8em; font-size: inherit; }
        /* 가장 중요한 버튼(시작/일시정지)은 색을 채워 눈에 띄게 */
        .btn.primary { background: var(--ok); color: var(--on-ok); border-color: transparent; font-weight: 700; }
        body[data-state="running"] .btn.primary { background: var(--warn); color: var(--on-warn); }

        /* 마우스가 있는 기기에서만 올렸을 때 효과 적용
           (휴대폰에선 누른 뒤에도 효과가 남아 이상하게 보이는 문제 방지) */
        @media (hover: hover) {
            .btn:hover:not(:disabled) { filter: brightness(1.15); }
            .chip:hover:not(.active) { border-color: var(--ok); color: var(--ok); }
            .step:hover { color: var(--fg); border-color: var(--ok); }
        }

        /* =================================================================
           스톱워치 구간 기록 목록
           목록이 길어져도 화면을 밀어내지 않도록 높이를 정해 두고 안에서 스크롤
           ================================================================= */
        #laps { width: min(100%, 34rem); flex: none; }
        .laps-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0.3rem 0.3rem;
            color: var(--muted);
            font-size: 0.85rem;
        }
        /* 구간 번호 / 구간 시간 / 전체 시간 세 칸 */
        .lap-row {
            display: grid;
            grid-template-columns: 4em 1fr 1fr;
            gap: 0.5rem;
            padding: 0.35rem 0.3rem;
            font-variant-numeric: tabular-nums;
        }
        .lap-cols { color: var(--muted); font-size: 0.75rem; padding-top: 0; padding-bottom: 0.2rem; }
        .lap-cols span:last-child, .lap-row .total { text-align: right; }
        #lapList {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: min(28vh, 16rem);
            overflow-y: auto;
            border-top: 1px solid var(--line);
        }
        #lapList li { border-bottom: 1px solid var(--line); font-size: 0.95rem; }
        #lapList .num   { color: var(--muted); }
        #lapList .split { font-weight: 700; white-space: nowrap; }
        #lapList .total { color: var(--muted); white-space: nowrap; }
        /* 가장 빠른 구간은 초록, 가장 느린 구간은 빨강 */
        #lapList li.best  .split { color: var(--ok); }
        #lapList li.worst .split { color: var(--danger); }
        .tag { margin-left: 0.4em; font-size: 0.75em; font-weight: 600; }
        /* 방금 기록한 구간이 잠깐 반짝임 */
        #lapList li.new { animation: flash 0.6s ease-out; }
        @keyframes flash { from { background: var(--line); } to { background: transparent; } }

        #help { margin: 0; color: var(--muted); font-size: 0.75rem; text-align: center; line-height: 1.8; }
        kbd {
            padding: 1px 0.35em;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--panel);
            font-family: inherit;
        }

        /* ----- 짧은 안내 메시지(토스트): 화면 아래에 잠깐 떴다 사라짐 ----- */
        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(1.5rem + env(safe-area-inset-bottom));
            transform: translate(-50%, 1rem);
            padding: 0.5em 1.1em;
            background: var(--fg);
            color: var(--bg);
            border-radius: 999px;
            font-size: 0.95rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 20;
            white-space: nowrap;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* =================================================================
           8. 상태별 화면 변화
              <body data-state="..." data-mode="...">의 값에 따라 자동 적용
           ================================================================= */

        /* 진행·일시정지·종료 중엔 입력칸을 숨겨 타이머 숫자에 집중
           (종료 후 "↺ 설정 시간으로"를 누르면 다시 나타남) */
        body[data-state="running"]  #setup,
        body[data-state="paused"]   #setup,
        body[data-state="finished"] #setup { display: none; }

        /* 스톱워치 모드에선 입력칸·진행 막대가 필요 없음 */
        body[data-mode="stopwatch"] #setup,
        body[data-mode="stopwatch"] #caption,
        body[data-mode="stopwatch"] .progress { display: none; }

        /* 일시정지: 숫자가 천천히 깜빡여 멈춘 상태임을 알려 줌 */
        body[data-state="paused"] #timer { animation: breathe 1.6s ease-in-out infinite; }

        /* 거의 끝났을 때: 숫자가 살짝 고동침 */
        .display.danger #timer { animation: pulse 1s ease-in-out infinite; }

        /* 종료: 배경색 변경 + 숫자 깜빡임 */
        body[data-state="finished"] { background: var(--end-bg); color: var(--on-end); }
        body[data-state="finished"] .display { --level: var(--on-end); }
        body[data-state="finished"] #timer { animation: blink 1s steps(1) infinite; }
        body[data-state="finished"] .topbar,
        body[data-state="finished"] #currentTime { color: var(--on-end); }

        @keyframes breathe { 50% { opacity: 0.35; } }
        @keyframes pulse   { 50% { transform: scale(1.03); } }
        @keyframes blink   { 50% { opacity: 0.3; } }

        /* 진행 중 3초간 화면을 안 건드리면 버튼·시계를 숨기고 숫자만 남김
           (프로젝터·TV에 띄울 때 깔끔하게). 마우스를 움직이거나 화면을 누르면 다시 나타남 */
        .topbar, .mode-switch, .controls, #help { transition: opacity 0.5s; }
        body.hide-ui { cursor: none; }
        body.hide-ui .topbar,
        body.hide-ui .mode-switch,
        body.hide-ui .controls,
        body.hide-ui #help { opacity: 0; pointer-events: none; }
        /* 마우스를 쓰는 기기에선 숨겨져 있어도 그 자리를 클릭하면 바로 눌리게 함
           (터치 기기는 첫 터치로 버튼을 다시 보여 줌 → 안 보이는 버튼을 실수로 누르는 것 방지) */
        @media (hover: hover) {
            body.hide-ui .topbar,
            body.hide-ui .mode-switch,
            body.hide-ui .controls { pointer-events: auto; }
        }

        /* =================================================================
           9. 기기별 맞춤
           ================================================================= */

        /* 키보드가 없는 터치 기기·좁은 화면에선 단축키 안내를 숨김 */
        @media (hover: none), (max-width: 600px) {
            #help { display: none; }
        }

        /* 폭이 좁은 휴대폰(세로) */
        @media (max-width: 480px) {
            .topbar { padding: 0.5rem 0.8rem; font-size: 0.85rem; }
            .clock { gap: 0.5rem; }
            .year, .label-text { display: none; }  /* 연도·버튼 글자 생략 → 한 줄 유지 */
            .btn { font-size: 1.15rem; }
            /* 조작 버튼을 2칸씩 같은 폭으로 배치 */
            .controls { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
            .controls .btn { min-width: 0; padding: 0.55em 0.3em; }
            #themeMenu { grid-template-columns: repeat(3, auto); }
        }

        /* 폭도 좁고 키도 작은 휴대폰(예: 구형 아이폰 SE)
           → 간격·버튼을 조금씩 줄여 한 화면에 들어오게 */
        @media (max-width: 480px) and (max-height: 700px) {
            main { gap: 0.55rem; padding-bottom: 0.6rem; }
            #setup { gap: 0.5rem; }
            .preset-area, .preset-panel, #presets, #examPresets, .preset-tools { gap: 0.35rem; }
            #caption { font-size: 1.1rem; margin-bottom: 0.2rem; }
            .chip { min-height: 1.9em; padding: 0.15em 0.7em; font-size: 0.85rem; }
            .step { padding: 0.1em 0; font-size: 0.75rem; }
            .unit { font-size: 0.85rem; }
            .mode-switch button { padding: 0.35em 1.1em; }
            .controls .btn { padding: 0.45em 0.3em; }
        }

        /* 높이가 낮은 화면(휴대폰을 가로로 눕힌 경우)
           → 왼쪽엔 큰 숫자, 오른쪽엔 입력칸·버튼을 두는 2단 배치 */
        @media (orientation: landscape) and (max-height: 520px) {
            /* 화면 높이를 딱 맞게 고정 → 내용이 많아도 화면 밖으로 늘어나지 않음 */
            body { height: 100vh; height: 100dvh; }
            .topbar { padding: 0.3rem 1rem; font-size: 0.85rem; }
            main {
                display: grid;
                grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
                grid-template-areas:
                    "display mode"
                    "display setup"
                    "display controls";
                /* 가로 화면에서도 스위치는 오른쪽 맨 위, 버튼은 오른쪽 맨 아래에 고정
                   (가운데 줄만 늘었다 줄었다 함) */
                /* minmax(0, 1fr): 가운데 칸 내용(구간 기록 목록 등)이 길어도 칸이 늘어나지 않고
                   그 안에서 스크롤되게 함 */
                grid-template-rows: auto minmax(0, 1fr) auto;
                min-height: 0;
                align-content: stretch;
                padding-top: 0.4rem;
                align-items: center;
                justify-items: center;
                column-gap: 1.2rem;
                row-gap: 0.5rem;
                padding: 0 1rem 0.5rem;
            }
            /* 2단 배치에선 자동 여백 대신 칸 정렬을 쓰므로 여백을 없앰 */
            main > .display, main > .controls,
            body.has-laps main > #laps { margin: 0; }
            /* 구간 기록 목록은 오른쪽 가운데 칸(시간 설정 자리)에 표시 */
            #laps { grid-area: setup; align-self: stretch; display: flex; flex-direction: column; min-height: 0; }
            #laps[hidden] { display: none; }
            #lapList { max-height: none; flex: 1; min-height: 0; }
            .laps-head { font-size: 0.75rem; padding-bottom: 0.15rem; }
            .lap-row { padding: 0.2rem 0.3rem; }
            #lapList li { font-size: 0.8rem; }
            .display     { grid-area: display; }
            .mode-switch { grid-area: mode; }
            #setup       { grid-area: setup; gap: 0.4rem; }
            .controls    { grid-area: controls; display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
            .mode-switch button { padding: 0.3em 1.1em; }
            /* 가로 화면에선 [▲][숫자][▼]단위 를 옆으로 나란히 */
            .inputs { gap: 0.35rem; }
            .field { flex-direction: row; align-items: center; gap: 0.12rem; }
            .field input { font-size: 1.3rem; width: 1.9em; }
            .step { padding: 0.35em 0.25em; font-size: 0.65rem; }
            .unit { font-size: 0.75rem; }
            .chip  { min-height: 1.9em; padding: 0.1em 0.65em; font-size: 0.8rem; }
            .btn   { font-size: 1rem; min-width: 0; padding: 0.4em 0.7em; }
            .tab   { font-size: 0.75rem; padding: 0.2em 0.8em; }
            .preset-area, .preset-panel, #presets, #examPresets, .preset-tools { gap: 0.3rem; }
            #caption { font-size: 0.95rem; margin-bottom: 0.2rem; }
            #overtime { font-size: 1.2rem; }
        }

        /* 움직임을 줄이도록 설정한 사용자에게는 애니메이션 끄기 */
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body data-state="idle" data-mode="timer">

    <!-- ===== 상단 바 ===== -->
    <header class="topbar">
        <div class="clock">
            <!-- 연도는 좁은 화면에서 숨기려고 따로 감쌈 -->
            <span><span class="year" id="yearInfo"></span><span id="dateInfo"></span></span>
            <span id="currentTime">00:00:00.0</span>
        </div>
        <div class="tools">
            <label class="toggle"><input type="checkbox" id="soundOn" checked> 🔔<span class="label-text"> 알림음</span></label>

            <!-- 색상 테마 선택: 누르면 아래에 색 견본이 펼쳐짐
                 --s-bg / --s-fg = 견본에 보일 배경색 / 숫자색 -->
            <div class="menu-wrap">
                <button id="themeBtn" class="btn small" aria-haspopup="true">🎨<span class="label-text"> 색상</span></button>
                <div id="themeMenu" hidden>
                    <button class="swatch" data-theme="night"    style="--s-bg:#0b1020; --s-fg:#8ec5ff;"><span class="sample">12</span>밤하늘</button>
                    <button class="swatch" data-theme="mint"     style="--s-bg:#000000; --s-fg:rgb(174,242,166);"><span class="sample">12</span>민트</button>
                    <button class="swatch" data-theme="sunset"   style="--s-bg:#1b1214; --s-fg:#ffb38a;"><span class="sample">12</span>노을</button>
                    <button class="swatch" data-theme="light"    style="--s-bg:#f5f3ee; --s-fg:#17795a;"><span class="sample">12</span>밝게</button>
                    <button class="swatch" data-theme="contrast" style="--s-bg:#000000; --s-fg:#ffffff;"><span class="sample">12</span>고대비</button>
                </div>
            </div>

            <button id="fullscreenBtn" class="btn small">⛶<span class="label-text"> 전체 화면</span></button>
        </div>
    </header>

    <main>
        <!-- ===== 모드 전환 ===== -->
        <nav class="mode-switch">
            <!-- .badge = 뒤에서 돌아가는 중일 때 보이는 작은 점 -->
            <button data-mode="timer" class="active">타이머<span class="badge"></span></button>
            <button data-mode="stopwatch">스톱워치<span class="badge"></span></button>
        </nav>

        <!-- ===== 큰 숫자 / 진행 막대 / 초과 시간 ===== -->
        <section class="display" id="display">
            <!-- 모의고사 과목·OMR 제외 여부 설명 (해당될 때만 보임) -->
            <div id="caption"></div>
            <div id="timer">00<span class="u">분</span>00.0<span class="u">초</span></div>
            <div class="progress"><div id="progressBar"></div></div>
            <div id="overtime"></div>
        </section>

        <!-- ===== 시간 설정 영역 ===== -->
        <section id="setup">
            <!-- 시/분/초 칸. data-unit = ▲▼ 한 번에 바뀌는 초 수
                 (시 = 3600초, 분 = 60초, 초 = 1초)
                 inputmode="numeric": 휴대폰에서 숫자 키패드가 바로 뜨게 함 -->
            <div class="inputs">
                <div class="field" data-unit="3600">
                    <button class="step" data-dir="1" aria-label="1시간 늘리기">▲</button>
                    <input type="number" id="hours" min="0" value="0" inputmode="numeric" aria-label="시">
                    <button class="step" data-dir="-1" aria-label="1시간 줄이기">▼</button>
                    <span class="unit">시</span>
                </div>
                <div class="field" data-unit="60">
                    <button class="step" data-dir="1" aria-label="1분 늘리기">▲</button>
                    <input type="number" id="minutes" min="0" value="0" inputmode="numeric" aria-label="분">
                    <button class="step" data-dir="-1" aria-label="1분 줄이기">▼</button>
                    <span class="unit">분</span>
                </div>
                <div class="field" data-unit="1">
                    <button class="step" data-dir="1" aria-label="1초 늘리기">▲</button>
                    <input type="number" id="seconds" min="0" value="0" inputmode="numeric" aria-label="초">
                    <button class="step" data-dir="-1" aria-label="1초 줄이기">▼</button>
                    <span class="unit">초</span>
                </div>
            </div>

            <!-- 프리셋: [자주 쓰는 시간] / [모의고사] 두 탭으로 나눔

            <div class="preset-area">
                <div class="preset-tabs">
                    <button class="tab active" data-tab="mine">자주 쓰는 시간</button>
                    <button class="tab" data-tab="exam">모의고사</button>
                </div>

                <!-- 탭 1: 자주 쓰는 시간 (직접 추가·삭제 가능) -->
                <div class="preset-panel" id="minePanel">
                    <div id="presets"></div>
                    <div class="preset-tools">
                        <button id="savePresetBtn" class="chip ghost">＋ 지금 시간을 프리셋으로</button>
                        <button id="editPresetBtn" class="chip ghost">✎ 편집</button>

        </section>

        <!-- ===== 조작 버튼 (상태에 따라 필요한 것만 보임) ===== -->
        <section class="controls">
            <button id="mainBtn"  class="btn primary">시작</button>

            <kbd>+</kbd><kbd>−</kbd> 1분 &nbsp; <kbd>R</kbd> 설정 시간으로 &nbsp;
            <kbd>Del</kbd> 시간 지우기 &nbsp; <kbd>F</kbd> 전체 화면
        </p>
    </main>

    <!-- 짧은 안내 메시지 -->
    <div id="toast" role="status" aria-live="polite"></div>

    <script>
        // =================================================================
        // 1. 고정 설정값
        // =================================================================
        const TICK_MS         = 50;                                // 화면 갱신 간격(0.05초)
        const HIDE_UI_DELAY   = 3000;                              // 버튼 자동 숨김까지 대기 시간
        const MINUTE          = 60 * 1000;                         // 1분(밀리초)
        const MAX_MS          = (99 * 3600 + 59 * 60 + 59) * 1000; // 최대 설정 시간(99:59:59)
        const SETTINGS_KEY    = 'classroom-timer-settings';        // 설정 저장 이름
        const PRESETS_KEY     = 'classroom-timer-presets';         // 프리셋 저장 이름
        const MAX_PRESETS     = 12;                                // 프리셋 최대 개수
        const DEFAULT_PRESETS = [60, 180, 300, 600, 900, 1800, 3000]; // 기본 프리셋(초 단위)
        const DEFAULT_THEME   = 'night';                           // 기본 색상 테마

        // 모의고사 과목별 실제 시험 시간(분)
        // 과목을 더하거나 시간을 바꾸려면 이 목록만 고치면 됨
        const EXAM_PRESETS = [
            { name: '국어',            min: 80 },
            { name: '수학',            min: 100 },
            { name: '영어',            min: 70 },
            { name: '영어(듣기 제외)', min: 45 },
            { name: '한국사',          min: 30 },
            { name: '통사·통과',       min: 40 },
        ];
        const OMR_SEC = 5 * 60;                                    // OMR 카드 작성 시간(초)

        // =================================================================
        // 2. 화면 요소 가져오기
        // =================================================================
        const $ = id => document.getElementById(id);
        const el = {
            hours: $('hours'), minutes: $('minutes'), seconds: $('seconds'),
            timer: $('timer'), display: $('display'), setup: $('setup'),
            progressBar: $('progressBar'), overtime: $('overtime'),
            mainBtn: $('mainBtn'), minusBtn: $('minusBtn'), plusBtn: $('plusBtn'),
            lapBtn: $('lapBtn'), laps: $('laps'), lapList: $('lapList'),
            lapCount: $('lapCount'), copyLapsBtn: $('copyLapsBtn'),
            backBtn: $('backBtn'), clearBtn: $('clearBtn'),
            presets: $('presets'), examPresets: $('examPresets'), omrBtn: $('omrBtn'),
            minePanel: $('minePanel'), examPanel: $('examPanel'), caption: $('caption'),
            savePresetBtn: $('savePresetBtn'),
            editPresetBtn: $('editPresetBtn'), restorePresetBtn: $('restorePresetBtn'),
            soundOn: $('soundOn'), fullscreenBtn: $('fullscreenBtn'),
            themeBtn: $('themeBtn'), themeMenu: $('themeMenu'), themeColorMeta: $('themeColorMeta'),
            currentTime: $('currentTime'), dateInfo: $('dateInfo'), yearInfo: $('yearInfo'),
            toast: $('toast'),
        };
        const timeInputs  = [el.hours, el.minutes, el.seconds];
        const modeButtons = document.querySelectorAll('.mode-switch button');
        const swatches    = document.querySelectorAll('.swatch');
        const presetTabs  = document.querySelectorAll('.preset-tabs .tab');

        // =================================================================
        // 3. 상태(현재 상황)를 한 객체에 모아 관리
        //    mode : 'timer'(타이머) / 'stopwatch'(스톱워치)
        //    state: 'idle'(대기) / 'running'(진행) / 'paused'(일시정지) / 'finished'(종료)
        // =================================================================
        const S = {
            mode: 'timer',
            state: 'idle',
            totalMs: 0,        // 타이머: 처음 설정한 총 시간 (진행 막대 계산용)
            endTime: 0,        // 타이머: 끝나는 실제 시각
            startTime: 0,      // 스톱워치: 측정을 시작한 기준 시각
            savedMs: 0,        // 일시정지할 때 남은 시간(타이머) 또는 지난 시간(스톱워치)
            laps: [],          // 스톱워치: 구간 기록을 누른 순간의 전체 시간(밀리초) 목록
            theme: DEFAULT_THEME,
            presets: [...DEFAULT_PRESETS], // 프리셋 목록(초 단위)
            editingPresets: false,         // 프리셋 편집 중인지
            presetTab: 'mine',             // 보고 있는 프리셋 탭: 'mine'(자주 쓰는 시간) / 'exam'(모의고사)
            // 마지막으로 고른 "기준 시간". OMR 5분 제외를 켜고 끌 때 이 시간을 기준으로 계산함
            //  { sec: 기준 시간(초), name: 모의고사 과목 이름 또는 null }
            //  직접 시간을 고치면 null이 됨
            base: null,
            omr: false,                    // OMR 작성 5분 제외가 켜져 있는지
        };
        // 진행·일시정지 중인지 (시간 설정을 막아야 하는 상태)
        const isBusy = () => S.state === 'running' || S.state === 'paused';

        // 타이머와 스톱워치는 각자 따로 돌아감.
        // 지금 화면에 보이는 모드의 값은 S에, 화면에 안 보이는(뒤에서 도는) 모드의 값은
        // 여기에 보관해 두었다가 모드를 바꿀 때 서로 맞바꿈
        const MODE_FIELDS = ['state', 'totalMs', 'endTime', 'startTime', 'savedMs', 'laps'];
        const stored = { timer: null, stopwatch: null };
        const otherMode = () => (S.mode === 'timer' ? 'stopwatch' : 'timer');

        // =================================================================
        // 4. 시간 계산·표시 형식 함수
        // =================================================================

        // 입력칸 → 총 밀리초. 비어 있거나 음수면 0으로 처리
        function getInputMs() {
            const num = input => Math.max(0, parseInt(input.value, 10) || 0);
            const ms = (num(el.hours) * 3600 + num(el.minutes) * 60 + num(el.seconds)) * 1000;
            return Math.min(ms, MAX_MS);
        }

        // 밀리초 → 입력칸에 시/분/초로 나눠 넣기
        // 예: 초 칸에 90을 넣으면 자동으로 "1분 30초"로 정리됨
        function setInputsFromMs(ms) {
            const sec = Math.round(ms / 1000);
            el.hours.value   = Math.floor(sec / 3600);
            el.minutes.value = Math.floor((sec % 3600) / 60);
            el.seconds.value = sec % 60;
        }

        // 밀리초 → "15분 00.0초" 또는 "1시간 15분 00.0초" 글자
        //  roundUp  : 올림 사용(타이머용 - 시작 순간 설정 시간이 그대로 보이게)
        //  showHours: 1시간 미만이어도 "시간" 자리를 표시할지
        //  showTenths: 0.1초 자리를 표시할지
        // 분·초는 항상 두 자리(05분)로 써서 글자 폭이 일정함 → 숫자 크기가 흔들리지 않음
        function formatTime(ms, { roundUp = false, showHours = false, showTenths = true } = {}) {
            const safe   = Math.max(ms, 0);
            const tenths = roundUp ? Math.ceil(safe / 100) : Math.floor(safe / 100);
            const h = Math.floor(tenths / 36000);
            const m = Math.floor((tenths % 36000) / 600);
            const s = Math.floor((tenths % 600) / 10);
            const t = tenths % 10;
            const pad = n => String(n).padStart(2, '0');
            const secPart = showTenths ? `${pad(s)}.${t}초` : `${pad(s)}초`;
            // 1시간 미만이면 "시간" 자리를 생략 → 숫자가 더 크게 보임
            return (showHours || h > 0)
                ? `${h}시간 ${pad(m)}분 ${secPart}`
                : `${pad(m)}분 ${secPart}`;
        }

        // 큰 숫자 화면용: 단위 글자(시간·분·초)만 작은 글씨로 감쌈
        // 예: "15분 00.0초" → 15<작은>분</작은> 00.0<작은>초</작은>
        function toDisplayHTML(text) {
            // 빈칸은 큰 글씨 크기만큼 넓게 벌어지므로 지우고, 간격은 CSS 여백으로 조절
            return text.replace(/ /g, '').replace(/(시간|분|초)/g, '<span class="u">$1</span>');
        }

        // 초 → 프리셋 버튼에 쓸 이름. 예: 90 → "1분 30초", 3600 → "1시간"
        function presetLabel(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            const parts = [];
            if (h) parts.push(`${h}시간`);
            if (m) parts.push(`${m}분`);
            if (s) parts.push(`${s}초`);
            return parts.join(' ') || '0초';
        }

        // 지금 화면에 보여 줄 시간(밀리초)을 상태에 따라 계산
        function currentMs() {
            const now = Date.now();
            if (S.mode === 'timer') {
                if (S.state === 'running')  return S.endTime - now;  // 남은 시간
                if (S.state === 'paused')   return S.savedMs;
                if (S.state === 'finished') return 0;
                return getInputMs();                                 // 대기 중엔 입력값 미리보기
            }
            // 스톱워치
            if (S.state === 'running') return now - S.startTime;     // 지난 시간
            if (S.state === 'paused')  return S.savedMs;
            return 0;
        }

        // =================================================================
        // 5. 큰 숫자 크기를 화면에 꽉 차게 자동 조절
        //    글자 모양·화면 크기·상태가 바뀌었을 때만 다시 계산 (매번 재면 느려짐)
        // =================================================================
        let lastFitKey = '';
        function fitTimer(force = false) {
            // 숫자는 모두 폭이 같으므로(tabular-nums) 모양만 비교: "12분 34.5초" → "00분 00.0초"
            const shape = el.timer.textContent.replace(/\d/g, '0');
            const key = [shape, window.innerWidth, window.innerHeight, S.state, S.mode,
                         S.presets.length, S.editingPresets, S.presetTab, el.caption.textContent,
                         S.laps.length].join('|');
            if (!force && key === lastFitKey) return;
            lastFitKey = key;

            // (1) 100px일 때의 폭을 재서, 사용 가능한 폭(96%)에 꽉 차는 크기 계산
            el.timer.style.fontSize = '100px';
            const widthAt100 = el.timer.scrollWidth;
            const availWidth = el.display.clientWidth * 0.96;
            let size = availWidth / widthAt100 * 100;

            // (2) 세로 상한: 입력칸이 보일 땐 화면 높이의 30%, 숫자 위주일 땐 55%
            const setupVisible = el.setup.offsetParent !== null;
            size = Math.min(size, window.innerHeight * (setupVisible ? 0.30 : 0.55));
            el.timer.style.fontSize = size + 'px';

            // (3) 그래도 화면 세로를 넘치면(스크롤이 생기면) 넘친 만큼 줄임
            for (let i = 0; i < 3; i++) {
                const excess = document.documentElement.scrollHeight - window.innerHeight;
                if (excess <= 0) break;
                size = Math.max(40, size - excess - 2);
                el.timer.style.fontSize = size + 'px';
            }
        }

        // =================================================================
        // 6. 화면 그리기 - 숫자, 진행 막대, 경고 색, 초과 시간, 탭 제목
        // =================================================================
        function render() {
            const ms      = currentMs();
            const isTimer = S.mode === 'timer';
            const total   = S.state === 'idle' ? getInputMs() : S.totalMs;

            // (0) 큰 숫자 위의 설명 글자 (예: "국어 80분 · OMR 작성 5분 제외")
            //     글자가 바뀔 때만 고쳐 씀 (0.05초마다 다시 쓰면 불필요하게 느려짐)
            const caption = makeCaption();
            if (el.caption.textContent !== caption) el.caption.textContent = caption;

            // (1) 큰 숫자
            const text = isTimer
                ? formatTime(ms, { roundUp: true, showHours: total >= 3600 * 1000 })
                : formatTime(ms);
            // 글자가 바뀌었을 때만 화면을 고쳐 씀
            if (el.timer.dataset.text !== text) {
                el.timer.dataset.text = text;
                el.timer.innerHTML = toDisplayHTML(text);
            }
            fitTimer();   // 글자 모양이 바뀌었을 때만 실제로 다시 계산됨

            // (2) 진행 막대: 남은 비율(0~1)만큼 채움
            let ratio = 0;
            if (isTimer && total > 0) {
                ratio = S.state === 'idle' ? 1 : Math.min(Math.max(ms / total, 0), 1);
            }
            el.progressBar.style.transform = `scaleX(${ratio})`;

            // (3) 경고 색: 남은 시간이 적으면 노랑 → 빨강
            //     짧은 타이머에서도 자연스럽도록 "최대 1분/10초"와 "전체의 20%/10%" 중 작은 값 기준
            let level = '';
            if (isTimer && isBusy()) {
                if (ms <= Math.min(10 * 1000, total * 0.1))  level = 'danger';
                else if (ms <= Math.min(MINUTE, total * 0.2)) level = 'warn';
            }
            el.display.classList.toggle('warn',   level === 'warn');
            el.display.classList.toggle('danger', level === 'danger');

            // (4) 종료 후 얼마나 지났는지 표시
            //     예: "시간 초과 +5초", "시간 초과 +1분 5초"
            el.overtime.textContent = S.state === 'finished'
                ? `시간 초과 +${presetLabel(Math.floor((Date.now() - S.endTime) / 1000))}`
                : '';

            // (5) 브라우저 탭 제목 (다른 탭을 보고 있어도 확인 가능)
            if (S.state === 'idle')          document.title = '타이머';
            else if (S.state === 'finished') document.title = '⏰ 시간 종료';
            else document.title = `${S.state === 'paused' ? '⏸' : '⏱'} ${text}`;
        }

        // 버튼 글자·보이기 여부를 상태에 맞게 정리
        //  ┌ 대기     : [시작] [✕ 시간 지우기]
        //  ├ 진행/정지 : [일시 정지/재개] [−1분] [+1분] [↺ 설정 시간으로]
        //  └ 종료     : [다시 시작] [+1분] [↺ 설정 시간으로]
        //  (스톱워치는 [시작/일시정지] [↺ 0으로]만)
        function updateControls() {
            const busy    = isBusy();
            const isTimer = S.mode === 'timer';
            const st      = S.state;

            el.mainBtn.textContent = {
                idle: '시작', running: '일시 정지', paused: '재개', finished: '다시 시작',
            }[st];
            // 타이머인데 설정 시간이 0이면 시작 버튼을 끔
            el.mainBtn.disabled = isTimer && st === 'idle' && getInputMs() === 0;

            el.lapBtn.hidden   = !(!isTimer && st === 'running');   // 스톱워치 진행 중에만
            el.minusBtn.hidden = !(isTimer && busy);
            el.plusBtn.hidden  = !(isTimer && (busy || st === 'finished'));
            el.backBtn.hidden  = !(busy || st === 'finished');
            el.backBtn.textContent = isTimer ? '↺ 설정 시간으로' : '↺ 0으로';
            el.clearBtn.hidden   = !(isTimer && st === 'idle');
            el.clearBtn.disabled = getInputMs() === 0;

            // 모드 전환은 언제든 가능 (지금 보고 있는 모드만 강조)
            modeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === S.mode));
            // 진행 중엔 시간 입력만 막음
            timeInputs.forEach(input => input.disabled = busy);

            renderPresets();   // 지금 시간과 같은 프리셋 강조 표시를 갱신
            renderLaps();      // 구간 기록 목록 보이기/숨기기
        }

        // 상태를 바꿀 때는 항상 이 함수를 거침 → 화면·버튼·화면 꺼짐 방지가 함께 갱신됨
        function setState(state) {
            S.state = state;
            document.body.dataset.state = state;   // CSS의 상태별 스타일이 적용됨
            updateControls();
            // 화면 꺼짐 방지: 지금 모드든 뒤에서 도는 모드든 하나라도 쓰는 중이면 켬
            const other = stored[otherMode()];
            keepScreenOn(state !== 'idle' || (other !== null && other.state !== 'idle'));
            wakeUI();
            render();
        }

        // 모드 버튼의 작은 점: 화면에 안 보이는 모드가 뒤에서 어떤 상태인지 표시
        function updateModeBadges() {
            modeButtons.forEach(btn => {
                const bg = btn.dataset.mode === S.mode ? null : stored[btn.dataset.mode];
                const st = bg ? bg.state : 'idle';
                btn.classList.toggle('bg-running',  st === 'running');
                btn.classList.toggle('bg-paused',   st === 'paused');
                btn.classList.toggle('bg-finished', st === 'finished');
            });
        }

        // =================================================================
        // 7. 반복 실행(틱) - 페이지가 열려 있는 동안 0.05초마다 항상 실행
        //    "끝나는 시각 - 지금 시각"으로 계산하므로 다른 탭에 가 있어도 정확함
        // =================================================================
        function tick() {
            // (1) 지금 보고 있는 타이머가 끝났는지
            if (S.mode === 'timer' && S.state === 'running' && S.endTime - Date.now() <= 0) {
                finish();
            }
            // (2) 스톱워치를 보는 동안 뒤에서 돌던 타이머가 끝났는지
            const bgTimer = stored.timer;
            if (S.mode !== 'timer' && bgTimer && bgTimer.state === 'running'
                && bgTimer.endTime - Date.now() <= 0) {
                bgTimer.state = 'finished';
                playAlarm();
                showToast('⏰ 타이머 시간이 끝났어요');
            }
            updateModeBadges();
            render();   // 종료 후에도 계속 돌면서 "시간 초과"를 갱신
        }

        // =================================================================
        // 8. 주요 동작
        // =================================================================
        function start() {
            if (S.mode === 'timer') {
                const total = getInputMs();
                if (total <= 0) return;             // 0초면 시작하지 않음
                S.totalMs = total;
                S.endTime = Date.now() + total;
                setInputsFromMs(total);             // 입력칸 정리(예: 90초 → 1분 30초)
            } else {
                S.startTime = Date.now();
                S.laps = [];                        // 새로 시작하면 구간 기록도 새로
            }
            S.editingPresets = false;               // 시작하면 프리셋 편집은 끝냄
            prepareAudio();
            setState('running');
        }

        function pause() {
            S.savedMs = currentMs();                // 상태를 바꾸기 '전'에 시간 저장
            setState('paused');
        }

        function resume() {
            // 저장해 둔 시간을 기준으로 새 기준 시각을 계산
            if (S.mode === 'timer') S.endTime   = Date.now() + S.savedMs;
            else                    S.startTime = Date.now() - S.savedMs;
            setState('running');
        }

        function finish() {
            setState('finished');                   // 틱은 계속 돌면서 초과 시간을 표시
            playAlarm();
        }

        // ↺ 설정 시간으로: 타이머를 멈추고 설정해 둔 시간으로 되돌림 (설정값은 그대로)
        //   스톱워치에선 0으로 되돌림
        function reset() {
            S.laps = [];                            // 스톱워치 구간 기록도 지움
            setState('idle');
        }

        // =================================================================
        // 스톱워치 구간 기록
        // =================================================================

        // ⚑ 구간 기록: 누른 순간의 전체 시간을 목록에 추가
        function recordLap() {
            if (S.mode !== 'stopwatch' || S.state !== 'running') return;
            S.laps.push(currentMs());
            renderLaps(true);
        }

        // 각 구간에 걸린 시간 = 이번 기록 − 바로 앞 기록
        // 예: 기록 [10초, 25초, 33초] → 구간 시간 [10초, 15초, 8초]
        function lapSplits() {
            return S.laps.map((t, i) => t - (i > 0 ? S.laps[i - 1] : 0));
        }

        // 구간 기록 목록 다시 그리기 (최근 기록이 맨 위)
        //  isNew: 방금 기록했으면 true → 맨 위 줄을 잠깐 반짝임
        function renderLaps(isNew = false) {
            const show = S.mode === 'stopwatch' && S.laps.length > 0;
            el.laps.hidden = !show;
            document.body.classList.toggle('has-laps', show);
            el.lapList.innerHTML = '';
            if (!show) return;

            const splits = lapSplits();
            // 구간이 2개 이상이면 가장 빠른·느린 구간 표시 (모두 같으면 표시 안 함)
            let best = -1, worst = -1;
            if (splits.length >= 2) {
                best  = splits.indexOf(Math.min(...splits));
                worst = splits.indexOf(Math.max(...splits));
                if (splits[best] === splits[worst]) best = worst = -1;
            }

            el.lapCount.textContent = `구간 기록 ${S.laps.length}개`;
            for (let i = S.laps.length - 1; i >= 0; i--) {
                const li = document.createElement('li');
                li.className = 'lap-row';
                if (i === best)  li.classList.add('best');
                if (i === worst) li.classList.add('worst');
                if (isNew && i === S.laps.length - 1) li.classList.add('new');
                const tag = i === best ? '<span class="tag">빠름</span>'
                          : i === worst ? '<span class="tag">느림</span>' : '';
                // formatTime 결과는 숫자와 "분·초"뿐이라 HTML로 넣어도 안전함
                li.innerHTML =
                    `<span class="num">${i + 1}</span>` +
                    `<span class="split">${formatTime(splits[i])}${tag}</span>` +
                    `<span class="total">${formatTime(S.laps[i])}</span>`;
                el.lapList.appendChild(li);
            }
            el.lapList.scrollTop = 0;               // 새 기록(맨 위)이 보이게
        }

        // 기록 복사: 엑셀·한글·메모장에 붙여넣을 수 있게 탭으로 구분한 글자로 복사
        async function copyLaps() {
            const splits = lapSplits();
            const lines = ['구간\t구간 시간\t전체 시간'];
            S.laps.forEach((t, i) => lines.push(`${i + 1}\t${formatTime(splits[i])}\t${formatTime(t)}`));
            const text = lines.join('\n');
            try {
                await navigator.clipboard.writeText(text);
            } catch (e) {
                // 파일로 직접 연 경우 등 위 방법이 막히면 예전 방식으로 복사
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                ta.remove();
                if (!ok) return showToast('복사하지 못했어요');
            }
            showToast(`구간 기록 ${S.laps.length}개를 복사했어요`);
        }

        // ✕ 시간 지우기: 설정한 시간 자체를 0으로
        function clearInputs() {
            if (isBusy()) return;
            clearBase();
            setInputsFromMs(0);
            saveSettings();
            reset();
        }

        // 큰 버튼 하나로 상태에 맞는 동작 실행
        function toggleMain() {
            const actions = { idle: start, finished: start, running: pause, paused: resume };
            actions[S.state]();
        }

        // 진행 중 −1분 / +1분 (delta: 더할 밀리초, 음수면 빼기)
        function adjustRunning(delta) {
            if (S.mode !== 'timer') return;
            if (S.state === 'running') {
                // 최소 1초는 남겨 둠 (빼다가 갑자기 끝나지 않게)
                const remain = Math.max(1000, S.endTime - Date.now() + delta);
                S.endTime = Date.now() + remain;
                S.totalMs = Math.max(S.totalMs + delta, remain);
            } else if (S.state === 'paused') {
                S.savedMs = Math.max(1000, S.savedMs + delta);
                S.totalMs = Math.max(S.totalMs + delta, S.savedMs);
            } else if (S.state === 'finished' && delta > 0) {
                // 종료 후 +1분을 누르면 1분짜리 타이머로 바로 다시 시작
                S.totalMs = delta;
                S.endTime = Date.now() + delta;
                setState('running');
                return;
            } else if (S.state === 'idle') {
                adjustInput(delta);                 // 대기 중이면 설정 시간을 조절
                return;
            }
            render();
        }

        // 타이머 ↔ 스톱워치 전환 (언제든 가능)
        // 지금 모드의 진행 상황은 보관해 두고, 바꿀 모드의 진행 상황을 꺼내 옴
        // → 타이머를 켜 둔 채 스톱워치를 봐도 타이머는 뒤에서 계속 흘러감
        function setMode(mode) {
            if (mode === S.mode) return;
            // (1) 지금 모드의 값을 보관함에 넣기
            const current = {};
            MODE_FIELDS.forEach(k => current[k] = S[k]);
            stored[S.mode] = current;
            // (2) 바꿀 모드의 값을 꺼내기 (처음이면 대기 상태로 시작)
            const next = stored[mode] || { state: 'idle', totalMs: 0, endTime: 0, startTime: 0, savedMs: 0, laps: [] };
            stored[mode] = null;
            Object.assign(S, next);
            S.mode = mode;
            document.body.dataset.mode = mode;
            setState(S.state);                      // 꺼내 온 상태로 화면·버튼 갱신
            updateModeBadges();
        }

        // =================================================================
        // 9. 시간 설정을 편하게: ▲▼ 버튼, 길게 누르기, 마우스 휠, 방향키
        // =================================================================

        // 설정 시간을 delta(밀리초)만큼 바꾸기. 0 아래·최대값 위로는 안 넘어감
        // 예: 1분 0초에서 초 ▼ → 0분 59초 (자동으로 분에서 빌려 옴)
        function adjustInput(delta) {
            if (isBusy()) return;
            clearBase();                            // 직접 고친 시간이므로 과목·OMR 표시 해제
            const ms = Math.min(Math.max(getInputMs() + delta, 0), MAX_MS);
            setInputsFromMs(ms);
            saveSettings();
            if (S.state === 'finished') reset();
            else { updateControls(); render(); }
        }

        // 버튼을 길게 누르고 있으면 점점 빠르게 반복 실행
        function holdRepeat(btn, action) {
            let timerId = null;
            const stop = () => { clearTimeout(timerId); timerId = null; };
            btn.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return;         // 왼쪽 클릭·손가락 터치만
                e.preventDefault();                 // 휴대폰에서 길게 누를 때 메뉴가 뜨는 것 방지
                action();                           // 누르자마자 한 번
                let delay = 400;                    // 0.4초 뒤부터 반복 시작
                const loop = () => {
                    action();
                    delay = Math.max(40, delay * 0.8); // 반복할수록 빨라짐 (최대 초당 25번)
                    timerId = setTimeout(loop, delay);
                };
                timerId = setTimeout(loop, delay);
            });
            ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => btn.addEventListener(evt, stop));
            // 키보드(Tab으로 이동 후 Enter/Space)로 눌렀을 때도 동작
            btn.addEventListener('click', (e) => { if (e.detail === 0) action(); });
            btn.addEventListener('contextmenu', e => e.preventDefault());
        }

        document.querySelectorAll('.field').forEach(field => {
            const unit  = Number(field.dataset.unit) * 1000;   // 이 칸의 단위(밀리초)
            const input = field.querySelector('input');

            // ▲▼ 버튼
            field.querySelectorAll('.step').forEach(btn =>
                holdRepeat(btn, () => adjustInput(Number(btn.dataset.dir) * unit)));

            // 마우스 휠: 위로 굴리면 증가, 아래로 굴리면 감소
            // (노트북 터치패드는 작은 움직임이 많이 들어오므로 모아서 일정량마다 한 칸씩)
            let wheelSum = 0;
            field.addEventListener('wheel', (e) => {
                if (isBusy()) return;
                e.preventDefault();                 // 화면이 스크롤되지 않게
                wheelSum += e.deltaY;
                while (Math.abs(wheelSum) >= 40) {
                    adjustInput((wheelSum < 0 ? 1 : -1) * unit);
                    wheelSum -= Math.sign(wheelSum) * 40;
                }
            }, { passive: false });

            // 입력칸 안에서 ↑↓ 방향키
            input.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    adjustInput((e.key === 'ArrowUp' ? 1 : -1) * unit);
                }
            });
        });

        // =================================================================
        // 10. 프리셋 (기본 프리셋 + 직접 만든 프리셋)
        //     이 기기의 브라우저에 저장되므로 학생마다 자기 프리셋을 가질 수 있음
        // =================================================================

        // 프리셋 버튼들을 다시 그리기
        function renderPresets() {
            const current = Math.round(getInputMs() / 1000);
            el.presets.innerHTML = '';
            S.presets.forEach(sec => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                if (S.editingPresets) {
                    // 편집 중: 누르면 삭제
                    btn.classList.add('editing');
                    btn.textContent = presetLabel(sec);
                    const x = document.createElement('span');
                    x.className = 'x';
                    x.textContent = '✕';
                    btn.appendChild(x);
                    btn.setAttribute('aria-label', `${presetLabel(sec)} 프리셋 지우기`);
                    btn.addEventListener('click', () => removePreset(sec));
                } else {
                    // 평소: 누르면 그 시간으로 설정
                    btn.textContent = presetLabel(sec);
                    // 강조 표시: 기준 시간이 있으면 그것과 비교, 없으면 지금 입력된 시간과 비교
                    const isActive = S.base
                        ? (S.base.name === null && S.base.sec === sec)
                        : sec === current;
                    btn.classList.toggle('active', isActive);
                    btn.addEventListener('click', () => applyPreset(sec, null));
                }
                el.presets.appendChild(btn);
            });
            el.editPresetBtn.textContent = S.editingPresets ? '✓ 편집 끝' : '✎ 편집';
            el.savePresetBtn.hidden    = S.editingPresets;
            el.restorePresetBtn.hidden = !S.editingPresets;

            // 모의고사 탭: 고른 과목 강조
            el.examPresets.querySelectorAll('.chip').forEach(btn => {
                btn.classList.toggle('active', S.base !== null && S.base.name === btn.dataset.name);
            });
            // OMR 버튼: 켜짐/꺼짐 표시
            el.omrBtn.setAttribute('aria-pressed', String(S.omr));
            el.omrBtn.textContent = S.omr ? '✓ OMR 작성 5분 제외 중' : 'OMR 작성 5분 제외';
        }

        // 모의고사 과목 버튼 만들기 (처음 한 번만)
        // 예: "국어 80분" 버튼 → 누르면 80분으로 설정
        function buildExamPresets() {
            EXAM_PRESETS.forEach(exam => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.dataset.name = exam.name;
                btn.textContent = `${exam.name} ${exam.min}분`;
                btn.addEventListener('click', () => applyPreset(exam.min * 60, exam.name));
                el.examPresets.appendChild(btn);
            });
        }

        // 프리셋 누르기 → 그 시간을 "기준 시간"으로 정하고 입력칸에 반영
        //  sec : 프리셋 시간(초)
        //  name: 모의고사 과목 이름 (일반 프리셋이면 null)
        // OMR 5분 제외가 켜져 있으면 5분을 뺀 시간으로 설정됨
        function applyPreset(sec, name) {
            if (isBusy()) return;
            S.base = { sec, name };
            // 5분 이하 프리셋에서는 5분을 뺄 수 없으므로 OMR 제외를 끔
            if (S.omr && sec <= OMR_SEC) {
                S.omr = false;
                showToast('5분 이하 시간이라 OMR 5분 제외를 껐어요');
            }
            applyBase();
        }

        // 기준 시간 − (OMR 켜짐이면 5분) → 입력칸에 넣고 대기 화면으로
        function applyBase() {
            const sec = S.base.sec - (S.omr ? OMR_SEC : 0);
            setInputsFromMs(sec * 1000);
            saveSettings();
            reset();
        }

        // OMR 작성 5분 제외 켜기/끄기
        // 켜면 기준 시간에서 5분을 빼고, 끄면 기준 시간으로 되돌림
        // (여러 번 눌러도 5분씩 계속 빠지지 않음)
        function toggleOmr() {
            if (isBusy()) return;
            if (!S.omr) {
                // 프리셋을 안 골랐으면 지금 입력된 시간을 기준으로 삼음
                const base = S.base || { sec: Math.round(getInputMs() / 1000), name: null };
                if (base.sec <= OMR_SEC) return showToast('5분보다 긴 시간에서만 뺄 수 있어요');
                S.base = base;
                S.omr = true;
                applyBase();
                showToast(`5분을 뺐어요 → ${presetLabel(base.sec - OMR_SEC)}`);
            } else {
                S.omr = false;
                applyBase();
                showToast(`원래 시간으로 → ${presetLabel(S.base.sec)}`);
            }
        }

        // 시간을 직접 고치면 기준 시간·OMR 표시를 없앰
        // (직접 맞춘 시간은 더 이상 "국어 80분 − 5분"이 아니므로)
        function clearBase() {
            S.base = null;
            S.omr = false;
        }

        // 큰 숫자 위에 보일 설명 글자 만들기
        //  예: "국어 80분 · OMR 작성 5분 제외" / "국어 80분" / "OMR 작성 5분 제외"
        function makeCaption() {
            if (S.mode !== 'timer' || !S.base) return '';
            const parts = [];
            if (S.base.name) parts.push(`${S.base.name} ${Math.round(S.base.sec / 60)}분`);
            if (S.omr)       parts.push('OMR 작성 5분 제외');
            return parts.join(' · ');
        }

        // 프리셋 탭 바꾸기: 'mine'(자주 쓰는 시간) / 'exam'(모의고사)
        function setPresetTab(tab) {
            S.presetTab = tab === 'exam' ? 'exam' : 'mine';
            presetTabs.forEach(t => t.classList.toggle('active', t.dataset.tab === S.presetTab));
            el.minePanel.hidden = S.presetTab !== 'mine';
            el.examPanel.hidden = S.presetTab !== 'exam';
            if (S.presetTab !== 'mine') S.editingPresets = false;   // 다른 탭으로 가면 편집 끝냄
            renderPresets();
            fitTimer(true);                        // 높이가 바뀌므로 숫자 크기 다시 맞춤
        }

        // ＋ 지금 입력된 시간을 새 프리셋으로 저장
        function addPreset() {
            const sec = Math.round(getInputMs() / 1000);
            if (sec <= 0)                         return showToast('먼저 시간을 정해 주세요');
            if (S.presets.includes(sec))          return showToast(`'${presetLabel(sec)}'은(는) 이미 있어요`);
            if (S.presets.length >= MAX_PRESETS)  return showToast(`프리셋은 ${MAX_PRESETS}개까지 만들 수 있어요`);
            S.presets.push(sec);
            S.presets.sort((a, b) => a - b);      // 짧은 시간부터 순서대로
            savePresets();
            renderPresets();
            fitTimer(true);                        // 줄 수가 바뀌었을 수 있으니 숫자 크기 다시 맞춤
            showToast(`'${presetLabel(sec)}' 프리셋을 추가했어요`);
        }

        // 편집 중 ✕ → 프리셋 지우기
        function removePreset(sec) {
            S.presets = S.presets.filter(p => p !== sec);
            savePresets();
            renderPresets();
            fitTimer(true);
            showToast(`'${presetLabel(sec)}' 프리셋을 지웠어요`);
        }

        // 기본 프리셋으로 되돌리기
        function restorePresets() {
            if (!confirm('기본 프리셋으로 되돌릴까요?\n직접 만든 프리셋은 지워져요.')) return;
            S.presets = [...DEFAULT_PRESETS];
            S.editingPresets = false;
            savePresets();
            renderPresets();
            fitTimer(true);
            showToast('기본 프리셋으로 되돌렸어요');
        }

        function toggleEditPresets() {
            S.editingPresets = !S.editingPresets;
            renderPresets();
            fitTimer(true);
        }

        // =================================================================
        // 11. 짧은 안내 메시지(토스트)
        // =================================================================
        let toastTimer = null;
        function showToast(message) {
            el.toast.textContent = message;
            el.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2000);
        }

        // =================================================================
        // 12. 색상 테마
        // =================================================================
        function applyTheme(name) {
            // 모르는 이름이면 기본 테마로
            if (![...swatches].some(s => s.dataset.theme === name)) name = DEFAULT_THEME;
            S.theme = name;
            document.documentElement.dataset.theme = name;
            swatches.forEach(s => s.classList.toggle('active', s.dataset.theme === name));
            // 휴대폰 주소창 색도 배경색에 맞춤
            el.themeColorMeta.content =
                getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
        }
        // 🎨 버튼: 색 견본 메뉴 열고 닫기
        el.themeBtn.addEventListener('click', () => { el.themeMenu.hidden = !el.themeMenu.hidden; });
        swatches.forEach(s => s.addEventListener('click', () => {
            applyTheme(s.dataset.theme);
            saveSettings();
            el.themeMenu.hidden = true;
        }));
        // 메뉴 바깥을 누르면 닫기
        document.addEventListener('click', (e) => {
            if (!el.themeMenu.hidden && !e.target.closest('.menu-wrap')) el.themeMenu.hidden = true;
        });

        // =================================================================
        // 13. 종료 알림음 (삐삐삐 - 삐삐삐)
        //     소리 파일 없이 브라우저에서 직접 소리를 만듦
        // =================================================================
        let audioCtx = null;

        // 브라우저 정책상 사용자가 버튼을 누른 순간에 오디오를 준비해야 소리가 남
        function prepareAudio() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) { /* 오디오를 지원하지 않는 환경이면 소리 없이 진행 */ }
        }

        function playAlarm() {
            if (!el.soundOn.checked || !audioCtx) return;
            const offsets = [0, 0.25, 0.5, 1.2, 1.45, 1.7];   // 각 "삐" 소리가 나는 시점(초)
            offsets.forEach(offset => {
                const osc  = audioCtx.createOscillator();     // 소리 발생기
                const gain = audioCtx.createGain();           // 음량 조절기
                osc.frequency.value = 880;                    // 음 높이(Hz)
                osc.connect(gain);
                gain.connect(audioCtx.destination);           // 스피커로 연결
                const t = audioCtx.currentTime + offset;
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18); // 점점 작게
                osc.start(t);
                osc.stop(t + 0.2);
            });
        }

        // =================================================================
        // 14. 화면 꺼짐 방지 (지원하는 브라우저에서만)
        // =================================================================
        let wakeLock = null;
        async function keepScreenOn(on) {
            try {
                if (on && !wakeLock && 'wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                } else if (!on && wakeLock) {
                    await wakeLock.release();
                    wakeLock = null;
                }
            } catch (e) { /* 지원하지 않거나 거부되면 그냥 넘어감 */ }
        }
        // 다른 탭에 갔다 돌아오면 화면 꺼짐 방지가 풀리므로 다시 요청
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && S.state !== 'idle') keepScreenOn(true);
        });

        // =================================================================
        // 15. 진행 중 버튼 자동 숨김
        // =================================================================
        let hideTimer = null;
        function wakeUI() {
            document.body.classList.remove('hide-ui');
            clearTimeout(hideTimer);
            if (S.state === 'running') {
                hideTimer = setTimeout(() => {
                    // 마우스가 버튼 영역 위에 올라가 있으면 숨기지 않고 조금 뒤 다시 확인
                    // (마우스 기기에서만. 휴대폰은 마지막으로 누른 버튼을 계속 ':hover'로 취급하므로 제외)
                    if (window.matchMedia('(hover: hover)').matches &&
                        document.querySelector('.topbar:hover, .mode-switch:hover, .controls:hover')) {
                        wakeUI();
                        return;
                    }
                    document.body.classList.add('hide-ui');
                    el.themeMenu.hidden = true;     // 열려 있던 색상 메뉴도 닫기
                }, HIDE_UI_DELAY);
            }
        }
        // 터치 기기: 버튼이 숨겨진 상태에서의 첫 터치는 "버튼 다시 보여 주기"로만 쓰고,
        // 그 터치로 생기는 클릭은 무시함 (안 보이는 일시정지 버튼 등을 실수로 누르지 않게)
        let swallowClick = false;
        document.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'mouse' && document.body.classList.contains('hide-ui')) {
                swallowClick = true;
                setTimeout(() => { swallowClick = false; }, 700);  // 클릭이 안 생기면 잠시 뒤 해제
            }
        }, { capture: true });   // capture: 다른 처리보다 먼저 실행 (숨김이 풀리기 전에 확인)
        document.addEventListener('click', (e) => {
            if (swallowClick) {
                swallowClick = false;
                e.stopPropagation();
                e.preventDefault();
            }
        }, { capture: true });

        ['mousemove', 'pointerdown', 'touchstart'].forEach(evt =>
            document.addEventListener(evt, wakeUI, { passive: true }));

        // =================================================================
        // 16. 전체 화면
        //     아이폰처럼 전체 화면을 지원하지 않는 기기에선 버튼 자체를 숨김
        // =================================================================
        if (!document.fullscreenEnabled) el.fullscreenBtn.hidden = true;

        function toggleFullscreen() {
            if (!document.fullscreenEnabled) return;
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }
        document.addEventListener('fullscreenchange', () => {
            el.fullscreenBtn.querySelector('.label-text').textContent =
                document.fullscreenElement ? ' 전체 화면 끄기' : ' 전체 화면';
        });

        // =================================================================
        // 17. 저장/불러오기 (이 기기의 브라우저에 저장)
        //     브라우저가 저장을 막아도 타이머는 정상 동작하도록 try로 감쌈
        // =================================================================
        function saveSettings() {
            try {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify({
                    // 설정 시간·고른 과목·OMR 상태는 저장하지 않음
                    // → 페이지를 열 때마다 항상 0시 0분 0초에서 시작
                    sound: el.soundOn.checked,   // 알림음 켜짐 여부
                    theme: S.theme,              // 색상 테마
                    tab: S.presetTab,            // 보고 있던 프리셋 탭
                }));
            } catch (e) {}
        }
        function loadSettings() {
            try {
                const data = JSON.parse(localStorage.getItem(SETTINGS_KEY));
                if (data) {
                    // 시간은 불러오지 않음 (입력칸은 HTML에 적힌 0 그대로)
                    el.soundOn.checked = data.sound !== false;
                    if (data.theme) S.theme = data.theme;
                    if (data.tab)   S.presetTab = data.tab;
                }
            } catch (e) {}
        }
        function savePresets() {
            try { localStorage.setItem(PRESETS_KEY, JSON.stringify(S.presets)); } catch (e) {}
        }
        function loadPresets() {
            try {
                const data = JSON.parse(localStorage.getItem(PRESETS_KEY));
                // 저장된 값이 올바른 숫자 목록일 때만 사용
                if (Array.isArray(data)) {
                    S.presets = data
                        .filter(n => Number.isInteger(n) && n > 0 && n * 1000 <= MAX_MS)
                        .slice(0, MAX_PRESETS)
                        .sort((a, b) => a - b);
                }
            } catch (e) {}
        }

        // =================================================================
        // 18. 현재 시각·날짜 (0.1초마다 갱신)
        // =================================================================
        function updateClock() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const tenth = Math.floor(now.getMilliseconds() / 100);
            el.currentTime.textContent =
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}.${tenth}`;
            const dayOfWeek = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];
            el.yearInfo.textContent = `${now.getFullYear()}년 `;  // 좁은 화면에선 CSS로 숨김
            el.dateInfo.textContent = `${pad(now.getMonth() + 1)}월 ${pad(now.getDate())}일 (${dayOfWeek})`;
        }

        // =================================================================
        // 19. 버튼·입력칸·키보드·화면 크기 변화에 동작 연결
        // =================================================================
        el.mainBtn.addEventListener('click', toggleMain);
        el.minusBtn.addEventListener('click', () => adjustRunning(-MINUTE));
        el.plusBtn.addEventListener('click',  () => adjustRunning(+MINUTE));
        el.backBtn.addEventListener('click', reset);
        el.clearBtn.addEventListener('click', clearInputs);
        el.fullscreenBtn.addEventListener('click', toggleFullscreen);
        el.soundOn.addEventListener('change', saveSettings);
        el.savePresetBtn.addEventListener('click', addPreset);
        el.editPresetBtn.addEventListener('click', toggleEditPresets);
        el.restorePresetBtn.addEventListener('click', restorePresets);
        el.omrBtn.addEventListener('click', toggleOmr);
        el.lapBtn.addEventListener('click', recordLap);
        el.copyLapsBtn.addEventListener('click', copyLaps);
        presetTabs.forEach(t => t.addEventListener('click', () => {
            setPresetTab(t.dataset.tab);
            saveSettings();
        }));
        modeButtons.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));

        timeInputs.forEach(input => {
            // 누르면 숫자 전체 선택 → 바로 새 숫자를 입력 가능
            input.addEventListener('focus', () => input.select());
            // 숫자를 바꾸면 큰 화면에 바로 미리보기
            input.addEventListener('input', () => {
                clearBase();                        // 직접 입력한 시간이므로 과목·OMR 표시 해제
                if (S.state === 'finished') reset();
                else { updateControls(); render(); }
            });
            // 입력을 마치면 시/분/초를 정리(예: 75분 → 1시간 15분)하고 저장
            input.addEventListener('change', () => {
                setInputsFromMs(getInputMs());
                saveSettings();
                updateControls();
                render();
            });
        });

        // 버튼을 누른 뒤 포커스 해제 → Space 단축키가 버튼을 한 번 더 누르는 문제 방지
        // (프리셋처럼 나중에 만들어지는 버튼에도 적용되도록 문서 전체에서 처리)
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (btn) btn.blur();
        });

        // 화면 크기가 바뀌거나 기기를 돌리면(세로↔가로) 숫자 크기를 다시 맞춤
        window.addEventListener('resize', () => fitTimer(true));
        // 글꼴이 늦게 로드되면 폭이 달라지므로 다시 맞춤
        if (document.fonts) document.fonts.ready.then(() => fitTimer(true));

        // 키보드 단축키 (한글 입력 상태에서도 동작하도록 ㄱ, ㄹ도 인식)
        document.addEventListener('keydown', (e) => {
            wakeUI();
            if (e.key === 'Escape') el.themeMenu.hidden = true;
            // 입력칸 안에서는 숫자 입력이 우선. Enter = 시작, Esc = 입력 끝내기
            if (e.target.matches('input[type=number]')) {
                if (e.key === 'Enter')       { e.target.blur(); toggleMain(); }
                else if (e.key === 'Escape') { e.target.blur(); }
                return;
            }
            if (e.repeat && e.code === 'Space') return; // Space를 꾹 눌러 반복되는 것 방지
            const key = e.key.toLowerCase();
            if (e.code === 'Space') {
                e.preventDefault();                     // 화면 스크롤 방지
                toggleMain();
            } else if (key === 'l' || key === 'ㅣ') {
                recordLap();                            // 스톱워치 구간 기록
            } else if (key === 'r' || key === 'ㄱ') {
                reset();                                // 설정 시간으로
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                if (S.mode === 'timer') clearInputs();  // 시간 지우기 (대기 중일 때만 동작)
            } else if (key === 'f' || key === 'ㄹ') {
                toggleFullscreen();
            } else if (key === '+' || key === '=') {
                adjustRunning(+MINUTE);
            } else if (key === '-' || key === '_') {
                adjustRunning(-MINUTE);
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
                adjustRunning(e.key === 'ArrowUp' ? MINUTE : -MINUTE);
            }
        });

        // =================================================================
        // 20. 처음 시작할 때 실행
        // =================================================================
        loadSettings();                     // 지난번 설정 불러오기
        loadPresets();                      // 저장된 프리셋 불러오기
        buildExamPresets();                 // 모의고사 과목 버튼 만들기
        setPresetTab(S.presetTab);          // 지난번 보던 프리셋 탭 열기
        applyTheme(S.theme);                // 색상 테마 적용
        updateClock();
        setInterval(updateClock, 100);
        setState('idle');                   // 버튼·화면 초기 정리
        setInterval(tick, TICK_MS);         // 타이머·스톱워치 반복 실행 시작
    </script>
</body>
</html>
