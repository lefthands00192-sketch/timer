<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 한글이 깨지지 않도록 문자 인코딩 지정 -->
    <meta charset="UTF-8">
    <!-- 휴대폰·태블릿에서도 화면 크기에 맞게 보이도록 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타이머</title>
    <style>
        /* =================================================================
           1. 색상·기본값 모음
              색을 바꾸고 싶으면 여기 값만 고치면 화면 전체에 적용됨
           ================================================================= */
        :root {
            --bg: #000;                     /* 배경 */
            --fg: #f2f2f2;                  /* 기본 글자 */
            --muted: #8a8f98;               /* 흐린 글자(보조 정보) */
            --panel: #15181d;               /* 버튼·입력칸 바탕 */
            --line: #2a2f37;                /* 테두리 */
            --ok: rgb(174, 242, 166);       /* 평상시 타이머 색(연두) */
            --warn: #ffd166;                /* 시간이 얼마 안 남았을 때(노랑) */
            --danger: #ff6b6b;              /* 거의 끝났을 때(빨강) */
            --end-bg: #c1121f;              /* 종료 후 배경 */
        }

        /* 모든 요소의 크기 계산에 테두리·여백을 포함 (레이아웃 계산이 쉬워짐) */
        * { box-sizing: border-box; }

        /* =================================================================
           2. 전체 레이아웃: 위(시계) - 가운데(타이머) 세로 배치
           ================================================================= */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Pretendard', 'Malgun Gothic', Arial, sans-serif;
            user-select: none;                     /* 연타 시 글자 선택 방지 */
            transition: background-color 0.4s;
        }
        input { user-select: text; }               /* 입력칸은 선택 가능하게 */

        /* ----- 상단 바: 날짜/현재 시각(왼쪽), 옵션(오른쪽) ----- */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 14px 24px;
            color: var(--muted);
            font-size: clamp(14px, 2vw, 22px);
        }
        .clock {
            display: flex;
            gap: 16px;
            font-variant-numeric: tabular-nums;    /* 숫자 폭 고정 → 떨림 방지 */
        }
        #currentTime { color: var(--fg); }
        .tools { display: flex; gap: 10px; align-items: center; }
        .toggle { cursor: pointer; display: flex; align-items: center; gap: 6px; }

        /* ----- 가운데 영역 ----- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2.5vh, 28px);
            padding: 0 16px 24px;
        }

        /* =================================================================
           3. 모드 전환 스위치 (타이머 / 스톱워치)
           ================================================================= */
        .mode-switch {
            display: inline-flex;
            padding: 4px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
        }
        .mode-switch button {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 18px;
            padding: 8px 22px;
            border-radius: 999px;
            cursor: pointer;
        }
        .mode-switch button.active { background: var(--fg); color: var(--bg); font-weight: 700; }
        .mode-switch button:disabled:not(.active) { opacity: 0.4; cursor: not-allowed; }

        /* =================================================================
           4. 큰 타이머 숫자 + 진행 막대 + 초과 시간
              --level 값에 따라 숫자와 막대 색이 함께 바뀜
           ================================================================= */
        .display {
            --level: var(--ok);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .display.warn   { --level: var(--warn); }
        .display.danger { --level: var(--danger); }

        #timer {
            /* 화면 너비와 높이 중 작은 쪽에 맞춰 크기 자동 조절 */
            font-size: clamp(64px, min(19vw, 32vh), 300px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--level);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transition: color 0.3s;
        }

        /* 진행 막대: 남은 시간 비율만큼 채워짐 */
        .progress {
            width: min(90%, 1100px);
            height: 10px;
            margin-top: clamp(10px, 2vh, 24px);
            background: var(--line);
            border-radius: 999px;
            overflow: hidden;
        }
        #progressBar {
            height: 100%;
            background: var(--level);
            transform-origin: left;                /* 왼쪽 기준으로 줄어듦 */
            transition: transform 0.1s linear, background-color 0.3s;
        }

        /* 종료 후 "시간 초과 +00:12" 표시 (평소엔 빈 칸으로 자리만 차지) */
        #overtime {
            min-height: 1.3em;
            margin-top: 10px;
            font-size: clamp(20px, 3.5vw, 40px);
            font-variant-numeric: tabular-nums;
        }

        /* =================================================================
           5. 시간 입력칸과 빠른 설정 버튼
           ================================================================= */
        #setup {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .inputs { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .field {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 22px;
            color: var(--muted);
        }
        .field input {
            width: 2.6em;
            padding: 6px 4px;
            font-size: clamp(28px, 5vw, 44px);
            text-align: center;
            color: var(--fg);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            font-variant-numeric: tabular-nums;
        }
        .field input:focus { outline: 2px solid var(--ok); outline-offset: 2px; }
        /* 숫자 입력칸 옆의 작은 위/아래 화살표 숨기기 */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        #presets { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .chip {
            font-size: 18px;
            padding: 6px 16px;
            color: var(--fg);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
        }
        .chip:hover { border-color: var(--ok); color: var(--ok); }

        /* =================================================================
           6. 조작 버튼
           ================================================================= */
        .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .btn {
            min-width: 5.5em;
            padding: 12px 28px;
            font-size: clamp(20px, 2.6vw, 30px);
            color: var(--fg);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            cursor: pointer;
            transition: filter 0.2s, background-color 0.2s;
        }
        .btn:hover:not(:disabled) { filter: brightness(1.25); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn.small { min-width: 0; padding: 6px 14px; font-size: inherit; }
        /* 가장 중요한 버튼(시작/일시정지)은 색을 채워 눈에 띄게 */
        .btn.primary { background: var(--ok); color: #06240a; border-color: transparent; font-weight: 700; }
        body[data-state="running"] .btn.primary { background: var(--warn); color: #3a2a00; }

        #help { margin: 0; color: var(--muted); font-size: 14px; text-align: center; line-height: 1.8; }
        kbd {
            padding: 1px 6px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--panel);
            font-family: inherit;
        }

        /* =================================================================
           7. 상태별 화면 변화
              <body data-state="..." data-mode="...">의 값에 따라 자동 적용
           ================================================================= */

        /* 진행·일시정지 중엔 입력칸을 숨겨 타이머 숫자에 집중 */
        body[data-state="running"] #setup,
        body[data-state="paused"]  #setup { display: none; }

        /* 스톱워치 모드에선 입력칸·진행 막대·+1분 버튼이 필요 없음 */
        body[data-mode="stopwatch"] #setup,
        body[data-mode="stopwatch"] .progress,
        body[data-mode="stopwatch"] #addMinBtn { display: none; }

        /* 일시정지: 숫자가 천천히 깜빡여 멈춘 상태임을 알려 줌 */
        body[data-state="paused"] #timer { animation: breathe 1.6s ease-in-out infinite; }

        /* 거의 끝났을 때: 숫자가 살짝 고동침 */
        .display.danger #timer { animation: pulse 1s ease-in-out infinite; }

        /* 종료: 빨간 배경 + 흰 숫자 깜빡임 */
        body[data-state="finished"] { background: var(--end-bg); }
        body[data-state="finished"] .display { --level: #fff; }
        body[data-state="finished"] #timer { animation: blink 1s steps(1) infinite; }

        @keyframes breathe { 50% { opacity: 0.35; } }
        @keyframes pulse   { 50% { transform: scale(1.03); } }
        @keyframes blink   { 50% { opacity: 0.3; } }

        /* 진행 중 3초간 마우스를 안 움직이면 버튼·시계를 숨기고 숫자만 남김
           (프로젝터·TV에 띄울 때 깔끔하게). 마우스를 움직이면 다시 나타남 */
        .topbar, .mode-switch, .controls, #help { transition: opacity 0.5s; }
        body.hide-ui { cursor: none; }
        body.hide-ui .topbar,
        body.hide-ui .mode-switch,
        body.hide-ui .controls,
        body.hide-ui #help { opacity: 0; pointer-events: none; }

        /* 움직임을 줄이도록 설정한 사용자에게는 애니메이션 끄기 */
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body data-state="idle" data-mode="timer">

    <!-- ===== 상단 바 ===== -->
    <header class="topbar">
        <div class="clock">
            <span id="dateInfo"></span>
            <span id="currentTime">00:00:00.0</span>
        </div>
        <div class="tools">
            <label class="toggle"><input type="checkbox" id="soundOn" checked> 🔔 알림음</label>
            <button id="fullscreenBtn" class="btn small">전체 화면</button>
        </div>
    </header>

    <main>
        <!-- ===== 모드 전환 ===== -->
        <nav class="mode-switch">
            <button data-mode="timer" class="active">타이머</button>
            <button data-mode="stopwatch">스톱워치</button>
        </nav>

        <!-- ===== 큰 숫자 / 진행 막대 / 초과 시간 ===== -->
        <section class="display" id="display">
            <div id="timer">00:00.0</div>
            <div class="progress"><div id="progressBar"></div></div>
            <div id="overtime"></div>
        </section>

        <!-- ===== 시간 입력 + 빠른 설정 ===== -->
        <section id="setup">
            <div class="inputs">
                <label class="field"><input type="number" id="hours"   min="0" value="0"><span>시간</span></label>
                <label class="field"><input type="number" id="minutes" min="0" value="0"><span>분</span></label>
                <label class="field"><input type="number" id="seconds" min="0" value="0"><span>초</span></label>
            </div>
            <!-- data-min = 설정할 분 -->
            <div id="presets">
                <button class="chip" data-min="1">1분</button>
                <button class="chip" data-min="3">3분</button>
                <button class="chip" data-min="5">5분</button>
                <button class="chip" data-min="10">10분</button>
                <button class="chip" data-min="15">15분</button>
                <button class="chip" data-min="30">30분</button>
                <button class="chip" data-min="50">50분</button>
            </div>
        </section>

        <!-- ===== 조작 버튼 ===== -->
        <section class="controls">
            <button id="mainBtn" class="btn primary">시작</button>
            <button id="addMinBtn" class="btn">+1분</button>
            <button id="resetBtn" class="btn">초기화</button>
        </section>

        <p id="help">
            <kbd>Space</kbd> 시작·일시정지 &nbsp; <kbd>R</kbd> 초기화 &nbsp;
            <kbd>+</kbd> 1분 추가 &nbsp; <kbd>F</kbd> 전체 화면 &nbsp; 입력칸에서 <kbd>Enter</kbd> 시작
        </p>
    </main>

    <script>
        // =================================================================
        // 1. 고정 설정값
        // =================================================================
        const TICK_MS       = 50;                              // 화면 갱신 간격(0.05초)
        const HIDE_UI_DELAY = 3000;                            // 버튼 자동 숨김까지 대기 시간
        const ADD_MS        = 60 * 1000;                       // +1분 버튼이 더하는 시간
        const MAX_MS        = (99 * 3600 + 59 * 60 + 59) * 1000; // 최대 설정 시간(99:59:59)
        const STORAGE_KEY   = 'classroom-timer-settings';      // 설정 저장 이름

        // =================================================================
        // 2. 화면 요소 가져오기
        // =================================================================
        const $ = id => document.getElementById(id);
        const el = {
            hours: $('hours'), minutes: $('minutes'), seconds: $('seconds'),
            timer: $('timer'), display: $('display'),
            progressBar: $('progressBar'), overtime: $('overtime'),
            mainBtn: $('mainBtn'), addMinBtn: $('addMinBtn'), resetBtn: $('resetBtn'),
            soundOn: $('soundOn'), fullscreenBtn: $('fullscreenBtn'),
            currentTime: $('currentTime'), dateInfo: $('dateInfo'),
        };
        const timeInputs    = [el.hours, el.minutes, el.seconds];
        const modeButtons   = document.querySelectorAll('.mode-switch button');
        const presetButtons = document.querySelectorAll('#presets button');

        // =================================================================
        // 3. 상태(현재 상황)를 한 객체에 모아 관리
        //    mode : 'timer'(타이머) / 'stopwatch'(스톱워치)
        //    state: 'idle'(대기) / 'running'(진행) / 'paused'(일시정지) / 'finished'(종료)
        // =================================================================
        const S = {
            mode: 'timer',
            state: 'idle',
            totalMs: 0,     // 타이머: 처음 설정한 총 시간 (진행 막대 계산용)
            endTime: 0,     // 타이머: 끝나는 실제 시각
            startTime: 0,   // 스톱워치: 측정을 시작한 기준 시각
            savedMs: 0,     // 일시정지할 때 남은 시간(타이머) 또는 지난 시간(스톱워치)
            tickId: null,   // setInterval 번호
        };

        // =================================================================
        // 4. 시간 계산·표시 형식 함수
        // =================================================================

        // 입력칸 → 총 밀리초. 비어 있거나 음수면 0으로 처리
        function getInputMs() {
            const num = input => Math.max(0, parseInt(input.value, 10) || 0);
            const ms = (num(el.hours) * 3600 + num(el.minutes) * 60 + num(el.seconds)) * 1000;
            return Math.min(ms, MAX_MS);
        }

        // 밀리초 → 입력칸에 시/분/초로 나눠 넣기
        // 예: 초 칸에 90을 넣으면 자동으로 "1분 30초"로 정리됨
        function setInputsFromMs(ms) {
            const sec = Math.round(ms / 1000);
            el.hours.value   = Math.floor(sec / 3600);
            el.minutes.value = Math.floor((sec % 3600) / 60);
            el.seconds.value = sec % 60;
        }

        // 밀리초 → "분:초.0" 또는 "시:분:초.0" 글자
        //  roundUp  : 올림 사용(타이머용 - 시작 순간 설정 시간이 그대로 보이게)
        //  showHours: 1시간 미만이어도 "시" 자리를 표시할지
        //  showTenths: 0.1초 자리를 표시할지
        function formatTime(ms, { roundUp = false, showHours = false, showTenths = true } = {}) {
            const safe   = Math.max(ms, 0);
            const tenths = roundUp ? Math.ceil(safe / 100) : Math.floor(safe / 100);
            const h = Math.floor(tenths / 36000);
            const m = Math.floor((tenths % 36000) / 600);
            const s = Math.floor((tenths % 600) / 10);
            const t = tenths % 10;
            const pad = n => String(n).padStart(2, '0');
            // 1시간 미만이면 "시" 자리를 생략 → 숫자가 더 크게 보임
            const text = (showHours || h > 0) ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
            return showTenths ? `${text}.${t}` : text;
        }

        // 지금 화면에 보여 줄 시간(밀리초)을 상태에 따라 계산
        function currentMs() {
            const now = Date.now();
            if (S.mode === 'timer') {
                if (S.state === 'running')  return S.endTime - now;  // 남은 시간
                if (S.state === 'paused')   return S.savedMs;
                if (S.state === 'finished') return 0;
                return getInputMs();                                 // 대기 중엔 입력값 미리보기
            }
            // 스톱워치
            if (S.state === 'running') return now - S.startTime;     // 지난 시간
            if (S.state === 'paused')  return S.savedMs;
            return 0;
        }

        // =================================================================
        // 5. 화면 그리기 - 숫자, 진행 막대, 경고 색, 초과 시간, 탭 제목
        // =================================================================
        function render() {
            const ms      = currentMs();
            const isTimer = S.mode === 'timer';
            const total   = S.state === 'idle' ? getInputMs() : S.totalMs;

            // (1) 큰 숫자
            const text = isTimer
                ? formatTime(ms, { roundUp: true, showHours: total >= 3600 * 1000 })
                : formatTime(ms);
            el.timer.textContent = text;

            // (2) 진행 막대: 남은 비율(0~1)만큼 가로로 채움
            let ratio = 0;
            if (isTimer && total > 0) {
                ratio = S.state === 'idle' ? 1 : Math.min(Math.max(ms / total, 0), 1);
            }
            el.progressBar.style.transform = `scaleX(${ratio})`;

            // (3) 경고 색: 남은 시간이 적으면 노랑 → 빨강
            //     짧은 타이머에서도 자연스럽도록 "최대 1분/10초"와 "전체의 20%/10%" 중 작은 값 기준
            let level = '';
            if (isTimer && (S.state === 'running' || S.state === 'paused')) {
                if (ms <= Math.min(10 * 1000, total * 0.1))      level = 'danger';
                else if (ms <= Math.min(60 * 1000, total * 0.2)) level = 'warn';
            }
            el.display.classList.toggle('warn',   level === 'warn');
            el.display.classList.toggle('danger', level === 'danger');

            // (4) 종료 후 얼마나 지났는지 표시
            el.overtime.textContent = S.state === 'finished'
                ? `시간 초과 +${formatTime(Date.now() - S.endTime, { showTenths: false })}`
                : '';

            // (5) 브라우저 탭 제목 (다른 탭을 보고 있어도 확인 가능)
            if (S.state === 'idle')          document.title = '타이머';
            else if (S.state === 'finished') document.title = '⏰ 시간 종료';
            else document.title = `${S.state === 'paused' ? '⏸' : '⏱'} ${text}`;
        }

        // 버튼 글자·활성화 여부를 상태에 맞게 정리
        function updateControls() {
            const busy = S.state === 'running' || S.state === 'paused';

            el.mainBtn.textContent = {
                idle: '시작', running: '일시 정지', paused: '재개', finished: '다시 시작',
            }[S.state];
            // 타이머인데 설정 시간이 0이면 시작 버튼을 끔
            el.mainBtn.disabled = S.mode === 'timer' && S.state === 'idle' && getInputMs() === 0;

            // 진행 중엔 모드 전환·시간 입력을 막음
            modeButtons.forEach(btn => {
                btn.disabled = busy;
                btn.classList.toggle('active', btn.dataset.mode === S.mode);
            });
            timeInputs.forEach(input => input.disabled = busy);
        }

        // 상태를 바꿀 때는 항상 이 함수를 거침 → 화면·버튼·화면 꺼짐 방지가 함께 갱신됨
        function setState(state) {
            S.state = state;
            document.body.dataset.state = state;   // CSS의 상태별 스타일이 적용됨
            updateControls();
            keepScreenOn(state !== 'idle');
            wakeUI();
            render();
        }

        // =================================================================
        // 6. 반복 실행(틱)
        //    "끝나는 시각 - 지금 시각"으로 계산하므로 다른 탭에 가 있어도 정확함
        // =================================================================
        function tick() {
            if (S.mode === 'timer' && S.state === 'running' && S.endTime - Date.now() <= 0) {
                finish();
            }
            render();   // 종료 후에도 계속 돌면서 "시간 초과"를 갱신
        }
        function startTicking() {
            stopTicking();
            S.tickId = setInterval(tick, TICK_MS);
            tick();     // 누르자마자 바로 표시
        }
        function stopTicking() {
            clearInterval(S.tickId);
            S.tickId = null;
        }

        // =================================================================
        // 7. 주요 동작: 시작 / 일시정지 / 재개 / 종료 / 초기화 / +1분 / 모드 전환
        // =================================================================
        function start() {
            if (S.mode === 'timer') {
                const total = getInputMs();
                if (total <= 0) return;             // 0초면 시작하지 않음
                S.totalMs = total;
                S.endTime = Date.now() + total;
                setInputsFromMs(total);             // 입력칸 정리(예: 90초 → 1분 30초)
                saveSettings();                     // 다음에 열 때 같은 시간으로
            } else {
                S.startTime = Date.now();
            }
            prepareAudio();
            setState('running');
            startTicking();
        }

        function pause() {
            S.savedMs = currentMs();                // 상태를 바꾸기 '전'에 시간 저장
            stopTicking();
            setState('paused');
        }

        function resume() {
            // 저장해 둔 시간을 기준으로 새 기준 시각을 계산
            if (S.mode === 'timer') S.endTime   = Date.now() + S.savedMs;
            else                    S.startTime = Date.now() - S.savedMs;
            setState('running');
            startTicking();
        }

        function finish() {
            setState('finished');                   // 틱은 멈추지 않음 → 초과 시간 계속 표시
            playAlarm();
        }

        function reset() {
            stopTicking();
            setState('idle');                       // 입력한 시간은 그대로 둠
        }

        // 큰 버튼 하나로 상태에 맞는 동작 실행
        function toggleMain() {
            const actions = { idle: start, finished: start, running: pause, paused: resume };
            actions[S.state]();
        }

        // +1분: 어느 상태에서든 동작
        function addMinute() {
            if (S.mode !== 'timer') return;
            if (S.state === 'running') {
                S.endTime += ADD_MS;
                S.totalMs += ADD_MS;
            } else if (S.state === 'paused') {
                S.savedMs += ADD_MS;
                S.totalMs += ADD_MS;
            } else if (S.state === 'finished') {
                // 종료 후 누르면 1분짜리 타이머로 바로 다시 시작
                S.totalMs = ADD_MS;
                S.endTime = Date.now() + ADD_MS;
                setState('running');
                startTicking();
                return;
            } else {
                // 대기 중이면 입력칸에 1분 더하기
                setInputsFromMs(Math.min(getInputMs() + ADD_MS, MAX_MS));
                saveSettings();
                updateControls();
            }
            render();
        }

        function setMode(mode) {
            if (S.state === 'running' || S.state === 'paused') return;
            S.mode = mode;
            document.body.dataset.mode = mode;
            reset();
        }

        // =================================================================
        // 8. 종료 알림음 (삐삐삐 - 삐삐삐)
        //    소리 파일 없이 브라우저에서 직접 소리를 만듦
        // =================================================================
        let audioCtx = null;

        // 브라우저 정책상 사용자가 버튼을 누른 순간에 오디오를 준비해야 소리가 남
        function prepareAudio() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) { /* 오디오를 지원하지 않는 환경이면 소리 없이 진행 */ }
        }

        function playAlarm() {
            if (!el.soundOn.checked || !audioCtx) return;
            const offsets = [0, 0.25, 0.5, 1.2, 1.45, 1.7];   // 각 "삐" 소리가 나는 시점(초)
            offsets.forEach(offset => {
                const osc  = audioCtx.createOscillator();     // 소리 발생기
                const gain = audioCtx.createGain();           // 음량 조절기
                osc.frequency.value = 880;                    // 음 높이(Hz)
                osc.connect(gain);
                gain.connect(audioCtx.destination);           // 스피커로 연결
                const t = audioCtx.currentTime + offset;
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18); // 점점 작게
                osc.start(t);
                osc.stop(t + 0.2);
            });
        }

        // =================================================================
        // 9. 화면 꺼짐 방지 (지원하는 브라우저에서만)
        //    수업 중 노트북·태블릿 화면이 절전으로 꺼지지 않게 함
        // =================================================================
        let wakeLock = null;
        async function keepScreenOn(on) {
            try {
                if (on && !wakeLock && 'wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                } else if (!on && wakeLock) {
                    await wakeLock.release();
                    wakeLock = null;
                }
            } catch (e) { /* 지원하지 않거나 거부되면 그냥 넘어감 */ }
        }
        // 다른 탭에 갔다 돌아오면 화면 꺼짐 방지가 풀리므로 다시 요청
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && S.state !== 'idle') keepScreenOn(true);
        });

        // =================================================================
        // 10. 진행 중 버튼 자동 숨김
        // =================================================================
        let hideTimer = null;
        function wakeUI() {
            document.body.classList.remove('hide-ui');
            clearTimeout(hideTimer);
            if (S.state === 'running') {
                hideTimer = setTimeout(() => document.body.classList.add('hide-ui'), HIDE_UI_DELAY);
            }
        }
        ['mousemove', 'pointerdown', 'touchstart'].forEach(evt =>
            document.addEventListener(evt, wakeUI, { passive: true }));

        // =================================================================
        // 11. 전체 화면
        // =================================================================
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.()?.catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }
        // 전체 화면 상태에 따라 버튼 글자 변경
        document.addEventListener('fullscreenchange', () => {
            el.fullscreenBtn.textContent = document.fullscreenElement ? '전체 화면 끄기' : '전체 화면';
        });

        // =================================================================
        // 12. 설정 저장/불러오기 (마지막 설정 시간, 알림음 켜짐 여부)
        //     브라우저가 저장을 막아도 타이머는 정상 동작하도록 try로 감쌈
        // =================================================================
        function saveSettings() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    ms: getInputMs(),
                    sound: el.soundOn.checked,
                }));
            } catch (e) {}
        }
        function loadSettings() {
            try {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (data) {
                    setInputsFromMs(data.ms || 0);
                    el.soundOn.checked = data.sound !== false;
                }
            } catch (e) {}
        }

        // =================================================================
        // 13. 현재 시각·날짜 (0.1초마다 갱신)
        // =================================================================
        function updateClock() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const tenth = Math.floor(now.getMilliseconds() / 100);
            el.currentTime.textContent =
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}.${tenth}`;
            const dayOfWeek = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];
            el.dateInfo.textContent =
                `${now.getFullYear()}년 ${pad(now.getMonth() + 1)}월 ${pad(now.getDate())}일 (${dayOfWeek})`;
        }

        // =================================================================
        // 14. 버튼·입력칸·키보드에 동작 연결
        // =================================================================
        el.mainBtn.addEventListener('click', toggleMain);
        el.addMinBtn.addEventListener('click', addMinute);
        el.resetBtn.addEventListener('click', reset);
        el.fullscreenBtn.addEventListener('click', toggleFullscreen);
        el.soundOn.addEventListener('change', saveSettings);
        modeButtons.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));

        // 빠른 설정 버튼: 해당 분으로 입력칸을 채움
        presetButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setInputsFromMs(Number(btn.dataset.min) * 60 * 1000);
                saveSettings();
                reset();       // 종료 화면이었다면 대기 상태로 돌아가며 미리보기 표시
            });
        });

        timeInputs.forEach(input => {
            // 누르면 숫자 전체 선택 → 바로 새 숫자를 입력 가능
            input.addEventListener('focus', () => input.select());
            // 숫자를 바꾸면 큰 화면에 바로 미리보기
            input.addEventListener('input', () => {
                if (S.state === 'finished') reset();
                else { updateControls(); render(); }
            });
            // 입력을 마치면 시/분/초를 정리(예: 75분 → 1시간 15분)하고 저장
            input.addEventListener('change', () => {
                setInputsFromMs(getInputMs());
                saveSettings();
                render();
            });
        });

        // 버튼을 누른 뒤 포커스 해제 → Space 단축키가 버튼을 한 번 더 누르는 문제 방지
        document.querySelectorAll('button').forEach(btn =>
            btn.addEventListener('click', () => btn.blur()));

        // 키보드 단축키 (한글 입력 상태에서도 동작하도록 ㄱ, ㄹ도 인식)
        document.addEventListener('keydown', (e) => {
            wakeUI();
            // 입력칸 안에서는 숫자 입력이 우선. Enter = 시작, Esc = 입력 끝내기
            if (e.target.matches('input[type=number]')) {
                if (e.key === 'Enter')       { e.target.blur(); toggleMain(); }
                else if (e.key === 'Escape') { e.target.blur(); }
                return;
            }
            if (e.repeat) return;                       // 키를 꾹 누를 때 반복 실행 방지
            const key = e.key.toLowerCase();
            if (e.code === 'Space') {
                e.preventDefault();                     // 화면 스크롤 방지
                toggleMain();
            } else if (key === 'r' || key === 'ㄱ') {
                reset();
            } else if (key === 'f' || key === 'ㄹ') {
                toggleFullscreen();
            } else if (key === '+' || key === '=' || e.key === 'ArrowUp') {
                e.preventDefault();
                addMinute();
            }
        });

        // =================================================================
        // 15. 처음 시작할 때 실행
        // =================================================================
        loadSettings();                     // 지난번 설정 불러오기
        updateClock();
        setInterval(updateClock, 100);
        setState('idle');                   // 버튼·화면 초기 정리
    </script>
</body>
</html>
